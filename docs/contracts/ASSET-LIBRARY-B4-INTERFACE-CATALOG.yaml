# Phase 11 B4 洁净室接口目录：未接入数据源的能力必须失败关闭。
meta:
  version: p12-a1-2
  distribution: NOT AUTHORIZED FOR PUBLIC DISTRIBUTION
  data_policy: "真实落盘素材库树；本机文件仅限 GW_ALLOWED_ROOTS，未配置即拒绝；不伪造资产或内容。"
  auth_policy: "所有接口先完成认证；写接口先完成编辑权限检查。"
  unavailable_status: 503
  unavailable_code: ASSET_LIBRARY_NOT_INTEGRATED
  local_asset_index_contract: "本地素材索引与 LOCAL-ASSET-INTERFACE-CATALOG.yaml 共用 local_asset_index；asset_id 唯一且单调分配；移动/删除后磁盘、GET 与重启读回一致。"
  migration_boundary: "历史重复本地 asset_id 仅可通过确定性映射显式修复，不根据歧义 ID 选择对象；旧提示词库/分类无持久化映射的条目保留其原始父引用且不得绑定新父库。"
