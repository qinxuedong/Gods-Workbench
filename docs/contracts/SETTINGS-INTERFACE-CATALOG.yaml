meta:
  source: "洁净室自有设计（由主代理依据根 AGENTS.md 3.1/3.2/3.3、docs/governance/TASK-NOTES-2026-09-18.md 功能域表与前端 web/js/asset-manager/api.js、api-settings.js 调用面收敛）"
  review_status: "coordinator_frozen_pending_independent_review"
  distribution: "NOT AUTHORIZED FOR PUBLIC DISTRIBUTION"
  cleanroom_notice: "仅记录 method/path/body/status/schema/错误/验收语义；不含旧仓源码结构或实现细节。"

service: settings
version: p12-r3-1

# 冻结说明（Phase 10D，2026-09-22）
# 本契约是「设置页」阶段的最小实现授权范围，仅覆盖下列 9 条归一化路径 / 14 个方法。
# 其余相邻端点（尤其 /api/asset-registry/assets*、/api/local-assets*、/api/storage-files*、
# /api/asset-registry/reindex、/api/asset-registry/project-directory*）仍属 KNOWN_UNIMPLEMENTED，
# 未获契约授权，本阶段不得顺带实现，并由契约测试显式反向断言其保持 404/405。

decisions:
  provider_runtime_references:
    decision: "运行时 Provider 仅由进程环境 GW_PROVIDER_RUNTIME_JSON 提供的 JSON 映射解析；每项只含 base_url、api_key_env 环境变量名、model 或 models/default_model，以及可选 video_protocol。base_url 可为 API 根或以单个 /v1 结尾，公共路径拼接器不得形成 /v1/v1。禁止在此映射或 API 响应保存/返回凭据值。"
    rationale: "Provider 管理页当前不持久化凭据；服务端必须以明确运行配置引用验证 provider_id 与模型，不能把任意客户端 provider 标签绑定默认 GW_CHAT_* 环境配置。"
    legacy_compatibility: "GW_CHAT_BASE_URL/GW_CHAT_API_KEY/GW_CHAT_MODEL 仅作为固定 legacy_environment 单模型兼容项；无 provider_id 的旧调用可使用，显式未知 provider_id 绝不回退到旧默认配置。"
    video_protocol: "共享解析器只登记 newapi_video 作为可识别视频协议；本轮此设置契约不授权视频端点实现。"
    secret_policy: "api_key_env 仅是环境变量名称，密钥只在请求执行时读取，不写盘、不回显、不记日志；状态 GET 不返回 URL 或环境变量名。"
  stable_ids:
    decision: "对外稳定 ID：结构体用 structure_id（strc_NNNN），存储设置用 revision，provider 用 provider_id"
    rationale: "根 AGENTS.md 3.1 强制统一稳定 ID；禁止 pid / cid / sid 等别名。"
    id_format: "结构体 structure_id 为确定性前缀序号字符串（4 位补零），禁止随机数、uuid 或时间戳作为外部 ID。provider_id 一律来自调用方提交，服务端**绝不自造**厂商 ID。"
    frontend_compat: "前端 registryStructureId 读取 value.id || value.structure_id，normalizeRegistryAssetStructure 读取 structure_type || kind；provider 列表读取 data.providers 且逐项读取 item.id。本阶段未改动前端，provider 以调用方原样提交的字段回传（含其自带 id），provider_id 仅作为服务端登记键，不由服务端生成。"
  forbidden_fabrication:
    decision: "不得伪造设置页数据"
    rationale: "洁净室零伪造口径（对齐 Phase 10B/10C）。"
    enforcement: "GET /api/storage-settings 在无真实配置来源时返回 configured: false、空 dirs/空集合与 data_gaps，不得编造根目录、容量或路径；GET /api/providers 默认必须返回 providers: []，不得预置任何厂商条目；结构体成员 asset 元数据在素材注册表未接入时不得编造（省略而非填充假状态）；禁止 random / uuid4 生成业务内容。"
  providers_empty_list:
    decision: "providers 空列表口径：默认 GET /api/providers 返回 providers: []、configured: false 与 data_gaps"
    rationale: "无真实厂商数据源时不得预置演示条目；空列表是唯一诚实取值。"
  probe_fail_closed:
    decision: "探测端点真实接入：POST /api/providers/{fetch-models,probe-async,test-connection} 对 https 或本机 http 做真实 HTTP 探测，失败时 fail-closed"
    rationale: "无真实出网探测实现时，绝不允许返回伪造的模型列表、伪造的连通性成功或伪造的延迟数字。"
    error_code: "PROVIDER_PROBE_NOT_INTEGRATED（503）"
    real_probe_note: "如未来接入真实探测，必须默认关闭并在未启用时如实降级为同一错误码，不得静默放行。"
  cas_scope:
    decision: "CAS 粒度：PATCH /api/storage-settings 校验存储设置 revision；PUT /api/providers 校验 provider 集合 revision；PATCH/DELETE 结构体校验目标结构 version；POST 结构体校验集合 revision；PATCH 结构体 current 校验目标结构 version"
    rationale: "根 AGENTS.md 3.2 要求写入类操作携带 expected_version，版本不一致必须 409，禁止静默覆盖。"
  expected_version_source:
    decision: "expected_version 一律可选（缺省表示不校验）：PATCH/POST 位于请求体，DELETE 无请求体故位于查询串"
    rationale: "前端 saveStorageSettings 发送 expected_revision，deleteAssetStructure 以查询串发送 expected_version；本阶段既接受契约字段 expected_version，也接受前端既有别名 expected_revision。"
  version_conflict_codes:
    decision: "409 错误码：存储设置与 provider 集合使用 VERSION_CONFLICT；结构体使用 STRUCTURE_VERSION_CONFLICT"
    rationale: "结构体冲突需与项目/画布 CAS 冲突区分，故在契约中写死独立错误码，但外层仍是标准错误包。"
  auth_and_permissions:
    decision: "认证与权限：读端点需认证（401 UNAUTHORIZED / 403 FORBIDDEN）；写端点需写权限（401 / 403）"
    rationale: "复用 core/auth.py 的 require_authenticated / require_edit_access，不自造权限体系；401 码沿用 core/errors.py 既有权威值。"
  error_codes:
    decision: "错误码表：400 INVALID_REQUEST；401 UNAUTHORIZED；403 FORBIDDEN；404 STRUCTURE_NOT_FOUND；409 VERSION_CONFLICT / STRUCTURE_VERSION_CONFLICT；503 PROVIDER_PROBE_NOT_INTEGRATED"
    rationale: "外层结构统一为标准错误包：detail 内至少含 code 与 message。"
  forbidden_neighbors:
    decision: "禁止实现清单之外的相邻端点"
    rationale: "未获契约授权的端点不得实现；契约测试对其保持 404/405 做反向断言。"

endpoints:

  - name: get_storage_settings
    method: GET
    path: /api/storage-settings
    body: null
    status:
      - 200
      - 401
      - 403
    schema:
      response_200:
        configured: boolean
        revision: integer
        dirs: object
        defaults: object
        extra_local_dirs: array
        extra_local_entries: array
        local_library_names: object
        local_library_order: array
        local_libraries: array
        data_status: "string（not_configured | ok）"
        data_gaps: array
    errors:
      401: "未认证"
      403: "角色不合法（只读以外的非法角色）"
    acceptance: "无真实配置来源时必须返回 configured: false 与 data_gaps，且 dirs 为空对象；不得编造根目录、容量或路径。"

  - name: patch_storage_settings
    method: PATCH
    path: /api/storage-settings
    body:
      dirs: "object | optional"
      extra_local_entries: "array | optional"
      local_library_names: "object | optional"
      local_library_order: "array | optional"
      expected_version: "integer | optional（缺省时不校验 revision）"
      expected_revision: "integer | optional（前端既有别名，等价 expected_version）"
    status:
      - 200
      - 400
      - 401
      - 403
      - 409
    schema:
      response_200:
        configured: boolean
        revision: integer
        dirs: object
        extra_local_entries: array
        local_library_names: object
        local_library_order: array
        data_status: string
        data_gaps: array
    errors:
      400: "expected_version 非法或字段类型不合法"
      401: "未认证"
      403: "无写权限（只读角色）"
      409: "VERSION_CONFLICT revision 不一致"
    acceptance: "保存成功后 revision 递增并回传最新设置；revision 不一致必须 409 VERSION_CONFLICT，禁止静默覆盖。"

  - name: list_providers
    method: GET
    path: /api/providers
    body: null
    status:
      - 200
      - 401
      - 403
    schema:
      response_200:
        providers: array
        revision: integer
        configured: boolean
        data_status: "string（not_configured | ok）"
        data_gaps: array
    errors:
      401: "未认证"
      403: "角色不合法"
    acceptance: "默认必须返回 providers: []，不得预置任何厂商条目；未配置时必须 configured: false 并在 data_gaps 说明来源缺失。"

  - name: put_providers
    method: PUT
    path: /api/providers
    body: "array（逐项至少包含 provider_id 或调用方自带的 id）"
    query:
      expected_version: "integer | optional（缺省时不校验 provider 集合 revision）"
    status:
      - 200
      - 400
      - 401
      - 403
      - 409
    schema:
      response_200:
        providers: array
        revision: integer
        configured: boolean
        data_status: string
        data_gaps: array
    errors:
      400: "请求体不是数组、缺少可用 provider_id，或含重复 provider_id"
      401: "未认证"
      403: "无写权限（只读角色）"
      409: "VERSION_CONFLICT revision 不一致"
    acceptance: "保存成功后 provider 集合 revision 递增；凭据类字段（key / secret / token 一类）一律不落库、不回显；revision 不一致必须 409。"

  - name: fetch_provider_models
    method: POST
    path: /api/providers/fetch-models
    body:
      provider_id: "string | optional"
      base_url: "string（https 或 http://127.0.0.1）"
      protocol: "string | optional"
      image_request_mode: "string | optional"
      credential_fields: "凭据只用不存：不入库、不回显；仅用于一次真实请求"
    status:
      - 200
      - 400
      - 401
      - 403
      - 503
    schema:
      response_200:
        ok: true
        protocol: string
        all: "array(上游真实模型 ID)"
        total: integer
        image_models: array
        chat_models: array
        video_models: array
        data_status: ok
      response_503:
        detail:
          code: "PROVIDER_PROBE_FAILED | PROVIDER_PROBE_NOT_INTEGRATED"
    errors:
      400: "INVALID_REQUEST 缺少 base_url / INVALID_URL 非绝对地址或不可解析"
      401: "未认证"
      403: "无写权限或 URL_NOT_ALLOWED（非本机地址未使用 https）/ SSRF_BLOCKED（内网/保留网段）"
      503: "httpx 缺失 → PROVIDER_PROBE_NOT_INTEGRATED；上游/网络失败 → PROVIDER_PROBE_FAILED"
    acceptance: "真实 GET {base_url}/v1/models；模型列表只能来自上游响应，网络或解析失败必须 503，绝不伪造模型条目。"

  - name: probe_provider_async
    method: POST
    path: /api/providers/probe-async
    body:
      provider_id: "string | optional"
      base_url: "string（https 或 http://127.0.0.1）"
      protocol: "string | optional"
      credential_fields: "凭据只用不存：不入库、不回显"
    status:
      - 200
      - 400
      - 401
      - 403
      - 503
    schema:
      response_200:
        job_id: "pjob_NNNN（确定性序号，落盘可回读）"
        poll_hint: "/api/providers/probe-async/jobs/{job_id}"
        ok: boolean
        protocol: string
        status_code: integer
        raw: "上游响应（已剥离凭据）"
    errors:
      400: "INVALID_REQUEST / INVALID_URL"
      401: "未认证"
      403: "无写权限或 URL_NOT_ALLOWED / SSRF_BLOCKED"
      503: "httpx 缺失或上游不可达 → PROVIDER_PROBE_NOT_INTEGRATED / PROVIDER_PROBE_FAILED"
    acceptance: "真实请求后登记可回读任务，返回稳定 pjob_NNNN 与 poll_hint；不得伪造协议判定成功。"

  - name: get_provider_probe_job
    method: GET
    path: /api/providers/probe-async/jobs/{job_id}
    body: null
    status: [200, 401, 404]
    errors:
      404: "PROVIDER_PROBE_JOB_NOT_FOUND 目标任务不存在"
    acceptance: "返回 probe-async 登记的真实任务；不存在必须 404，不返回伪造状态。"

  - name: test_provider_connection
    method: POST
    path: /api/providers/test-connection
    body:
      provider_id: "string | optional"
      base_url: "string（https 或 http://127.0.0.1）"
      protocol: "string | optional"
      credential_fields: "凭据只用不存：不入库、不回显"
    status:
      - 200
      - 400
      - 401
      - 403
      - 503
    schema:
      response_200:
        ok: true
        status: integer
        latency_ms: "integer（实测往返毫秒）"
        protocol: string
        model_count: integer
        all: array
        data_status: ok
    errors:
      400: "INVALID_REQUEST / INVALID_URL"
      401: "未认证"
      403: "无写权限或 URL_NOT_ALLOWED / SSRF_BLOCKED"
      503: "httpx 缺失或上游不可达 → 不返回连通性结论或延迟数字"
    acceptance: "真实往返并记录实测延迟；失败必须 503，绝不伪造连通性成功或延迟数字。"

  - name: list_asset_structures
    method: GET
    path: /api/asset-registry/asset-structures
    body: null
    query:
      asset_ids: "string 可重复（按成员过滤）"
    status:
      - 200
      - 401
      - 403
    schema:
      response_200:
        items: array
        total: integer
        revision: integer
        data_status: "string（not_configured | ok）"
        data_gaps: array
    errors:
      401: "未认证"
      403: "角色不合法"
    acceptance: "返回真实内存结构集合；无结构时 items: []；成员 asset 元数据来源未接入时必须省略并在 data_gaps 说明，不得编造。"

  - name: create_asset_structure
    method: POST
    path: /api/asset-registry/asset-structures
    body:
      kind: "string（version | group）"
      asset_ids: "array（至少 2 个不重复 asset_id）"
      current_asset_id: "string | optional（必须是成员之一）"
      expected_version: "integer | optional（缺省时不校验集合 revision）"
    status:
      - 201
      - 400
      - 401
      - 403
      - 409
    schema:
      response_201:
        structure:
          structure_id: string
          kind: string
          current_asset_id: string
          version: integer
          created_at: "string(datetime)"
          updated_at: "string(datetime)"
          members: array
    errors:
      400: "kind 非法、asset_ids 少于 2 个、含重复项，或 current_asset_id 不属于成员"
      401: "未认证"
      403: "无写权限（只读角色）"
      409: "STRUCTURE_VERSION_CONFLICT 集合 revision 不一致"
    acceptance: "创建成功后返回稳定 structure_id（strc_NNNN）且集合 revision 递增；成员仅登记调用方提供的 asset_id，不得编造 asset 元数据。"

  - name: get_asset_structure
    method: GET
    path: /api/asset-registry/asset-structures/{structure_id}
    body: null
    status:
      - 200
      - 401
      - 403
      - 404
    schema:
      response_200:
        structure:
          structure_id: string
          kind: string
          current_asset_id: string
          version: integer
          members: array
    errors:
      401: "未认证"
      403: "角色不合法"
      404: "STRUCTURE_NOT_FOUND 目标结构不存在"
    acceptance: "返回目标结构真值；不存在必须 404 STRUCTURE_NOT_FOUND。"

  - name: update_asset_structure
    method: PATCH
    path: /api/asset-registry/asset-structures/{structure_id}
    body:
      asset_ids: "array | optional（至少 2 个不重复 asset_id）"
      current_asset_id: "string | optional（必须是成员之一）"
      expected_version: "integer | optional（缺省时不校验目标结构 version）"
    status:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 409
    schema:
      response_200:
        structure:
          structure_id: string
          kind: string
          current_asset_id: string
          version: integer
          members: array
    errors:
      400: "空请求体、asset_ids 非法或 current_asset_id 不属于成员"
      401: "未认证"
      403: "无写权限（只读角色）"
      404: "STRUCTURE_NOT_FOUND 目标结构不存在"
      409: "STRUCTURE_VERSION_CONFLICT 目标结构 version 不一致"
    acceptance: "更新成功后结构 version 递增；目标不存在或 CAS 不一致必须失败关闭，禁止静默覆盖。"

  - name: set_asset_structure_current
    method: PATCH
    path: /api/asset-registry/asset-structures/{structure_id}/current
    body:
      current_asset_id: "string（必须是成员之一）"
      expected_version: "integer | optional（缺省时不校验目标结构 version）"
    status:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 409
    schema:
      response_200:
        structure:
          structure_id: string
          kind: string
          current_asset_id: string
          version: integer
          members: array
    errors:
      400: "current_asset_id 缺失或不属于成员"
      401: "未认证"
      403: "无写权限（只读角色）"
      404: "STRUCTURE_NOT_FOUND 目标结构不存在"
      409: "STRUCTURE_VERSION_CONFLICT 目标结构 version 不一致"
    acceptance: "切换成功后 current_asset_id 更新且结构 version 递增；CAS 不一致必须 409 STRUCTURE_VERSION_CONFLICT。"

  - name: delete_asset_structure
    method: DELETE
    path: /api/asset-registry/asset-structures/{structure_id}
    body: null
    query:
      expected_version: "integer | optional（缺省时不校验目标结构 version）"
    status:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 409
    schema:
      response_200:
        deleted_structure_id: string
        revision: integer
    errors:
      400: "expected_version 非法（非正整数）"
      401: "未认证"
      403: "无写权限（只读角色）"
      404: "STRUCTURE_NOT_FOUND 目标结构不存在"
      409: "STRUCTURE_VERSION_CONFLICT 目标结构 version 不一致"
    acceptance: "删除成功后集合 revision 递增且结构从集合移除；目标不存在或 CAS 不一致必须失败关闭。"

unimplemented:
  note: "下列相邻端点未获本阶段契约授权，属 KNOWN_UNIMPLEMENTED；契约测试显式反向断言其保持 404/405。"
  paths:
    - "GET /api/asset-registry/assets"
    - "PATCH /api/asset-registry/assets/{asset_id}"
    - "GET /api/local-assets"
    - "GET /api/storage-files"
    - "POST /api/asset-registry/reindex"
    - "GET /api/asset-registry/project-directory-templates"

