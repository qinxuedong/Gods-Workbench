# -*- coding: utf-8 -*-
# Phase 11 B4 洁净室接口目录：未接入数据源的能力必须失败关闭。
meta:
  version: p12-a1-2
  distribution: NOT AUTHORIZED FOR PUBLIC DISTRIBUTION
  data_policy: "本机文件仅限 GW_ALLOWED_ROOTS 内的真实路径；未配置即拒绝一切本机文件访问。"
  auth_policy: "所有接口先完成认证；写接口先完成编辑权限检查。"
  unavailable_status: 503
  unavailable_code: LOCAL_ASSETS_NOT_INTEGRATED
  persistence: "索引使用 core.storage.JsonState 命名空间 local_asset_index；asset_id 在记录内按 local_NNNN 单调分配，重新索引同一对象保留 ID。"
  duplicate_id_migration: "检测到历史重复 asset_id 时，按展示路径稳定排序为所有冲突记录重新分配唯一 ID；返回修复映射。修复前按歧义 ID 更新必须 409 LOCAL_ASSET_ID_AMBIGUOUS。"
  file_index_consistency: "移动成功后索引路径同步更新且 asset_id 保留；删除成功后索引移除。索引写失败先补偿磁盘操作；不能补偿时显式返回部分失败与实际路径状态。"
# ---------------------------------------------------------------------------
# Phase 12 真实接入说明（2026-09-26）
# 相位 12 起：上传/移动/删除均对真实文件生效；本地索引落盘；越界路径一律 403。
# ---------------------------------------------------------------------------
