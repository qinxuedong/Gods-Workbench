# -*- coding: utf-8 -*-
meta:
  source: "Phase 12 A2 素材注册表真实后端接入"
  review_status: "implementation_pending_independent_review"
  distribution: "NOT AUTHORIZED FOR PUBLIC DISTRIBUTION"
  cleanroom_notice: "不复制旧仓实现；本机文件仅限 GW_ALLOWED_ROOTS；外部依赖缺失一律 503，不伪造成功。"
service: asset_registry
version: p12-a2-3
decisions:
  stable_ids: "对外只使用 asset_id、version_id、folder_id、job_id、project_id、entity_id、gate_id、tag_id、preset_id、template_id 等稳定字段；ID 由 core.storage.next_sequence() 确定性递增，禁止 uuid/随机。"
  real_store: "素材/关系/标签/图片版本/预设/目录模板/项目实体与门/回收站/远程素材/索引配置落盘到 core.storage.JsonState 命名空间 asset_registry（GW_DATA_DIR；测试为每例 tmp_path/data，开发为 .local/runtime-dev/data，生产为 %LOCALAPPDATA%/GodsWorkbench/data）；重启可恢复。"
  evidence_boundary: "单实例 JSON 落盘只保证单进程一致性；多 worker / 多实例并发写属部署方职责，本块未闭环。"
  cas: "所有写操作接受 expected_version；与当前 revision 不一致返回 409 VERSION_CONFLICT，附 expected_version/current_version，禁止静默覆盖；目录模板记录写以template_cas为准。"
  asset_list_query: "GET assets支持kind、archived、名称query/search、project_id、tag（tag_id或标签名）、include_tags/exclude_tags（逗号分隔，包含取全部匹配），category为image/video/audio/document/model/font/other按kind归类。sort支持newest/oldest/name/size_desc；省略时保持asset_id升序。view仅card/grid/list布局提示，不改变数据，其他值400。未知分类返回空结果，不忽略过滤。"
  additional_filters: "recent_days为1到36500的整数，筛选UTC当日零点往前指定天数后创建的记录，日期边界绑定游标指纹。root_id/collection_id未建立关联模型，非空时400 UNSUPPORTED_OPTION，不静默忽略。"
  facets_counts: "facets的kinds/categories返回name/count实际计数组，tags附真实引用数count；前端统计不得从字符串条目推断为零。"
  asset_list_cursor: "next_cursor为绑定查询指纹和集合revision的base64url(JSON)分页位置；格式错误/查询不一致400 INVALID_CURSOR，集合变更409 VERSION_CONFLICT；cursor与非零offset同时提供时必须一致；不使用未验证的客户端游标授权访问。"
  template_cas: "目录模板使用记录级version（旧记录缺字段时为1），PATCH/归档/默认必须携带expected_version；过期409，缺失或非整数400；成功递增真实记录版本。创建时expected_version若提供仍校验集合revision。默认切换会递增被取消默认记录的version。"
  template_fields: "name/project_type/directory_tree/slot_mapping创建、更新、GET保持一致落盘；folders是directory_tree兼容别名，同时提供且不一致返回400；目录为相对路径字符串数组，映射值须指向已声明目录；未知更新字段400。"
  auth: "读取端点要求认证；写入/治理端点先做角色检查；OIDC / local_account 模式下角色来自服务端身份，不信任请求头。"
  fail_closed: "本机文件访问未配置 GW_ALLOWED_ROOTS 即 403 LOCAL_FILE_ACCESS_NOT_ADMITTED；越界 403 PATH_OUTSIDE_ALLOWED_ROOTS；ffmpeg/ffprobe、可读媒体、允许根目录缺失返回 503，data_status=not_integrated/degraded；不回显原始绝对路径。"
  import_semantics: "multipart 上传真实落盘到 GW_DATA_DIR/registry_uploads（服务端生成文件名）；JSON 批量登记只登记元数据，不猜测文件内容。"
  archive_semantics: "POST /assets/archive 是前端「打包下载」入口：真实把已登记本地文件打包为 zip；无任何可打包文件返回 503 NO_LOCAL_FILES。"
  pdf_semantics: "POST /assets/export-pdf 用纯标准库生成合法 PDF，不引入 reportlab。"
  media_semantics: "GET .../media 与 .../image-versions/{version_id}/media 返回真实文件字节流；无媒体返回 503 MEDIA_NOT_AVAILABLE。video/frame|storyboard|clip 调用真实 ffmpeg/ffprobe，缺失即 503。"
  index_semantics: "POST /reindex 与 /index/sync 真实遍历 GW_ALLOWED_ROOTS；未配置根目录返回 503 INDEX_SOURCE_NOT_AVAILABLE；不删除任何文件。"
  remote_semantics: "POST /remote-assets 用 httpx 真实 HEAD 探测；失败如实记录 data_status=degraded + data_gaps，不编造 content-type/size；非本机地址必须 https，按解析主机和DNS检查受限网段；拒绝URL内凭据，不跟随重定向，不把3xx标为探测成功。"
  open_local_semantics: "POST .../open-local 只做路径准入校验，不调用 explorer/start/subprocess 启动任何外部程序。"
  canvas_boundary: "画布闭环（canvases/{id}/restore、purge-expired）只登记真实操作条目，画布状态不伪造；data_gaps 明示 canvas_store_not_connected。项目回收恢复已复用项目中心状态机，不再属于记录式占位。"
