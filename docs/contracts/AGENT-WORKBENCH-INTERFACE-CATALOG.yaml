meta:
  source: "Gods-Workbench 本地 Agent 接入实现"
  review_status: "signed_off_by_host_owner"
  distribution: "INTERNAL CONTRACT; not release acceptance"
  scope: "仅描述 Workbench HTTP 适配层，不改变 Agent 领域 run_id 与状态机"

service: agent_workbench_adapter
version: 1

interfaces:
  - name: create_agent_run
    method: POST
    path: /api/agent/runs
    body:
      project_id: string
      user_goal: string
      provider_id: "string | optional"
      model: "string | optional"
      mode: "enum(approval|automatic)"
      config_snapshot_id: string
      input_artifact_refs: "array[string] (must be empty until reference authorization is integrated)"
      idempotency_key: string
      request_id: string
    status:
      - 202
      - 400
      - 401
      - 403
      - 409
      - 503
    schema:
      response_202:
        job_id: "stable Workbench identifier; distinct from run_id"
        run_id: "stable Agent domain identifier"
        state: accepted
        agent_status: "enum(queued|running|waiting_review|paused|succeeded|failed|cancelled)"
        poll_hint: "/api/jobs/{job_id}"
        agent_poll_hint:
          status_uri: "/api/agent/runs/{run_id}"
          events_uri: "/api/agent/runs/{run_id}/events"
          suggested_interval_ms: 2000
    errors:
      400: "请求或当前配置档案不合法"
      401: "当前 Cookie 会话无效"
      403: "主体无项目创建权限"
      409: "同一幂等键已用于不同请求"
      503: "Agent 集成或服务端配置未就绪；任务未受理"
    acceptance: "重复提交同一幂等请求返回同一持久 job_id 和 run_id；旧版本指纹仅在持久请求字段与配置匹配时兼容重放。"

  - name: get_agent_job_status
    method: GET
    path: /api/jobs/{job_id}
    applies_when: "job_id begins with job_agent_"
    status:
      - 200
      - 401
      - 404
    schema:
      response_200:
        job_id: string
        run_id: string
        state: "enum(accepted|running|waiting_review|paused|completed|failed|cancelled)"
        agent_status: "enum(queued|running|waiting_review|paused|succeeded|failed|cancelled)"
        version: integer
        stage: "string | null"
        poll_hint: "string | null"
        agent_poll_hint:
          status_uri: string
          events_uri: string
          suggested_interval_ms: integer
    errors:
      401: "当前 Cookie 会话无效"
      404: "任务不存在或当前主体无权读取；故意统一响应以隐藏任务存在性"
    acceptance: "Agent 分支在读取状态前校验当前 Cookie 主体、身份域及项目所有权；终态时 Workbench poll_hint 为 null。此 Agent 专用 404 隐藏策略是通用 403 规则的端点例外。"

  - name: get_agent_reference_set
    method: GET
    path: /api/agent/sessions/{session_id}/references
    description: "MVP2-T1a 参考策展读取：返回会话绑定的项目、按 order 升序的参考条目与版本号"
    status:
      - 200
      - 401
      - 404
    schema:
      response_200:
        session_id: string
        project_id: string
        items:
          - asset_id: string
            decision: "enum(pending|selected|rejected)"
            note: "string | null (<=500)"
            order: "integer (>=0)"
            updated_at: "ISO-8601 datetime (UTC)"
        version: "integer (>=1)"
    errors:
      401: "未认证：缺少有效会话或令牌"
      404: "参考策展会话不存在（SESSION_NOT_FOUND）；读路径不隐式创建会话"
    acceptance: "空参考集会话返回合法空 items 而非 404；用同一 SQLite 文件重建台账后会话绑定、条目与版本号完整恢复；响应不含本地绝对路径。"

  - name: put_agent_reference_item
    method: PUT
    path: /api/agent/sessions/{session_id}/references/{asset_id}
    description: "MVP2-T1b 参考策展写入：按 asset_id 写入决策/备注/排序，CAS 冲突 409，同值重复 PUT 幂等"
    status:
      - 200
      - 400
      - 401
      - 404
      - 409
    schema:
      request:
        project_id: "string (必填，须与会话已绑定项目一致)"
        decision: "enum(pending|selected|rejected)"
        note: "string | null (<=500)"
        order: "integer (>=0)"
        expected_version: "integer (>=1)"
      response_200:
        session_id: string
        project_id: string
        items:
          - asset_id: string
            decision: "enum(pending|selected|rejected)"
            note: "string | null (<=500)"
            order: "integer (>=0)"
            updated_at: "ISO-8601 datetime (UTC)"
        version: "integer (>=1)"
    errors:
      400: "缺少 project_id 或入参不合法（PROJECT_CONTEXT_REQUIRED / INVALID_REQUEST）"
      401: "未认证：缺少有效会话或令牌"
      404: "参考策展会话不存在（SESSION_NOT_FOUND）；不隐式创建会话"
      409: "expected_version 与当前版本不一致（VERSION_CONFLICT）；或 project_id 与会话绑定不一致（PROJECT_CONTEXT_MISMATCH）"
    acceptance: "增改查往返正确且条目按 order 升序回读；重复相同 PUT 幂等（version 与 updated_at 不变）；版本冲突返回 409 VERSION_CONFLICT 且不落库；同一 SQLite 文件重建台账后数据完整恢复；响应不含本地绝对路径。"

task_status_projection:
  review_status: "signed_off_by_host_owner; 选项B扩展宿主TaskStatus已签认并实施"
  agent_to_workbench:
    queued: accepted
    running: running
    waiting_review: waiting_review
    paused: paused
    succeeded: completed
    failed: failed
    cancelled: cancelled
  preserve_agent_status: true
  terminal_agent_statuses:
    - succeeded
    - failed
    - cancelled
  terminal_poll_hint: null

ownership:
  source_of_truth: "Agent run 状态机；Workbench job_id 只作稳定外部关联键"
  durable_mapping: "host_agent_create_keys.job_id -> run_id"
  shared_observability_list: "not included until actor/project-filtered enumeration is defined"
  related_canvas_contract: "CANVAS-INTERFACE-CATALOG.yaml: run_smart_canvas_task"

# MVP2-T4（issue #368）：Agent 工具登记。字段与 gw.agent_runtime.policy.ToolRegistration
# 对齐统一为 risk_level / cost_state / input_schema；样片（animatic_generate）在公开代码
# 中无生成入口，暂不登记，待能力落地后补录。
tools:
  - name: asset_search
    risk_level: low
    cost_state: free
    idempotency_supported: true
    input_schema:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    output_schema:
      items:
        - asset_id: string
          score: float
          lexical_rank: "integer | null"
          vector_rank: "integer | null"
      vector_track_degraded: boolean
    description: "MVP2-T0 Agent 素材检索工具（只读，封装现有 HybridAssetSearcher 混合检索；检索器异常 fail closed，不泄露路径，不发起网络调用）"
  - name: script_generate
    description: "生成剧本阶段候选（full_script / scene_script）；handler 调用注入的前段候选服务"
    risk_level: medium
    cost_state: metered
    idempotency_supported: true
    input_schema:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - idempotency_key
      properties:
        run_id:
          type: string
          minLength: 1
        stage:
          type: string
          enum:
            - full_script
            - scene_script
        idempotency_key:
          type: string
          minLength: 8
        instructions:
          type: string
          maxLength: 4000
  - name: i2v_generate
    description: "提交图生视频生成任务；必须存在唯一且已批准的 i2v_submit 门禁，handler 调用注入的 VideoTaskService。"
    risk_level: high
    cost_state: metered
    required_permissions:
      - video.generate
    idempotency_supported: true
    input_schema:
      type: object
      additionalProperties: false
      required:
        - run_id
        - idempotency_key
        - provider_id
        - model
        - prompt
        - duration
        - aspect_ratio
        - production_context
      properties:
        run_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 8
        provider_id:
          type: string
          minLength: 1
          maxLength: 128
        model:
          type: string
          minLength: 1
          maxLength: 256
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 120
        aspect_ratio:
          type: string
          enum:
            - "16:9"
            - "9:16"
            - "1:1"
        production_context:
          type: object
          additionalProperties: false
          required:
            - project_id
            - canvas_id
            - entity_id
          properties:
            project_id:
              type: string
              minLength: 1
              maxLength: 128
            canvas_id:
              type: string
              minLength: 1
              maxLength: 128
            entity_id:
              type: string
              minLength: 1
              maxLength: 128
  - name: storyboard_generate
    description: "生成文字分镜候选（storyboard_text）；handler 调用注入的前段候选服务"
    risk_level: medium
    cost_state: metered
    idempotency_supported: true
    input_schema:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - idempotency_key
      properties:
        run_id:
          type: string
          minLength: 1
        stage:
          type: string
          enum:
            - storyboard_text
        idempotency_key:
          type: string
          minLength: 8
        instructions:
          type: string
          maxLength: 4000
