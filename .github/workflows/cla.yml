name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: |
          (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          branch: 'master'
          path-to-document: 'https://github.com/qinxuedong/Gods-Workbench/blob/master/CLA.md'
          custom-notsigned-prcomment: |
            感谢您向神工坊（Gods-Workbench）提交贡献！在合入您的代码前，请先阅读 [CLA.md](https://github.com/qinxuedong/Gods-Workbench/blob/master/CLA.md) 并在本 PR 下评论：
            `I have read the CLA Document and I hereby sign the CLA`
          custom-allsigned-prcomment: "所有贡献者均已完成 CLA 签署，感谢您的贡献！"
