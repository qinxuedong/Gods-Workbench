name: CI

# QIN-520：本工作流只承担「日常 PR 快速门禁」。
# 分层原则：日常 PR 校验规范、哈希锁、二进制白名单、前端全量契约与后端核心契约，
# 目标 3~5 分钟；全量回归、真实浏览器 E2E 与 Windows NSIS 安装包编译
# 统一由 `.github/workflows/release-desktop.yml`（Tag v* 或手动触发）承接。
# QIN-568：pytest 串行全量是墙钟瓶颈（实测 528~992s；3698 条结果 × 平均 ~140ms
# 串行，无病态慢用例），改按域矩阵 3 分片并行，pytest 分片加 --durations=20；
# 前端防漏检查/契约回归/二进制白名单扫描移入独立 frontend 作业只跑一份；
# desktop 作业加 rust-cache 复用 Cargo 构建缓存。
# 分片口径（按实测域耗时配平）：a=projects+assets+hygiene；
# b=agent/agents+auth+settings；c=tests/contracts 长尾扫尾（--ignore 掉 a/b
# 已覆盖域）。新增 contracts 域目录自动落入 c 片；a/b 引用目录改名时对应
# 分片会因收集失败响亮报错，属预期防护。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一 PR（或同一分支）再次推送时立即取消旧运行，杜绝队列堆积。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python contracts shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      # 不快速失败：同一 PR 的其余分片照常跑完，保证完整证据。
      fail-fast: false
      matrix:
        include:
          - shard: a-contracts-core
            pytest_args: "tests/contracts/projects tests/contracts/assets tests/hygiene"
          - shard: b-agent-auth-settings
            pytest_args: "tests/contracts/agent tests/contracts/agents tests/contracts/auth tests/contracts/settings"
          - shard: c-longtail-sweep
            pytest_args: "tests/contracts --ignore=tests/contracts/projects --ignore=tests/contracts/assets --ignore=tests/contracts/agent --ignore=tests/contracts/agents --ignore=tests/contracts/auth --ignore=tests/contracts/settings"
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.hashes

      - name: 记录 Python 缓存键版本
        id: python-cache-key
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: 恢复 Python 依赖环境缓存
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gw-python-venv
          key: gw-python-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-cache-key.outputs.version }}-${{ hashFiles('requirements.lock.hashes') }}

      - name: 复用或安装 Python 依赖环境
        env:
          PYTHON_ENV_CACHE_HIT: ${{ steps.python-env-cache.outputs.cache-hit }}
        # A-04：安装口径改为**哈希锁 + --require-hashes**，而不是只装区间依赖。
        # requirements.lock.hashes 为跨平台双段：Windows 段本机 CPython 3.11.9 实测，
        # Linux 段由 python:3.11-slim (CPython 3.11.16 / x86_64) 实测，两段均非伪造。
        # ubuntu-latest 按本平台哈希校验；uvloop 带环境标记，仅非 Windows 安装。
        # QIN-520：日常 PR 不再下载 Playwright 浏览器内核（约 1~2 分钟）。
        # 本层不跑 tests/e2e；少数契约用例使用系统 Chrome（channel="chrome"，
        # 镜像已预装），缺失时按既有策略显式 skip，不伪造浏览器证据。
        # 浏览器内核安装随全量回归下放到 release-desktop.yml。
        # QIN-568：该步骤随矩阵分片在 3 个作业中各自执行，缓存键一致；缓存未命中
        # 时各分片独立安装同一份哈希锁环境，互不冲突。
        run: |
          venv_path="${RUNNER_TEMP}/gw-python-venv"
          if [[ "$PYTHON_ENV_CACHE_HIT" != "true" ]]; then
            python -m venv "$venv_path"
            "$venv_path/bin/python" -m pip install --upgrade pip
            "$venv_path/bin/python" -m pip install --require-hashes -r requirements.lock.hashes
          fi
          if [[ ! -x "$venv_path/bin/python" ]]; then
            echo "Python 依赖环境缓存缺少可执行文件。" >&2
            exit 1
          fi
          echo "$venv_path/bin" >> "$GITHUB_PATH"

      - name: 验证关键依赖可导入
        run: python -c "import fastapi, httpx, pydantic, pytest, uvicorn, psutil, multipart, PIL, playwright, playwright.sync_api; print('依赖导入通过:', fastapi.__version__, pydantic.__version__, uvicorn.__version__, psutil.__version__, PIL.__version__, playwright.__file__)"

      - name: 校验哈希锁与版本锁一致
        # 防止两把锁漂移：哈希锁的 (name, version) 集合必须等于版本锁主表。
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def pairs(text, pattern):
              found = {}
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  m = re.match(pattern, line)
                  if m:
                      found[m.group(1).replace("_", "-").lower()] = m.group(2)
              return found

          ver = pairs(Path("requirements.lock").read_text(encoding="utf-8"),
                      r"^([A-Za-z0-9_.\-]+)==([^;\s]+)\s*$")
          hsh = pairs(Path("requirements.lock.hashes").read_text(encoding="utf-8"),
                      r"^([A-Za-z0-9_.\-]+)==([^;\s]+)(?:\s*;[^#]*?)?\s+--hash=")
          # uvloop 只在非 Windows 安装，属平台差异登记项：允许仅出现在哈希锁中。
          platform_only = {"uvloop"}
          only_ver = sorted(set(ver) - set(hsh))
          only_hsh = sorted(set(hsh) - set(ver) - platform_only)
          drift = sorted(k for k in set(ver) & set(hsh) if ver[k] != hsh[k])
          if only_ver or only_hsh or drift:
              print("版本锁/哈希锁不一致：")
              print("  仅版本锁有:", only_ver)
              print("  仅哈希锁有:", only_hsh)
              print("  版本漂移:", [(k, ver[k], hsh[k]) for k in drift])
              raise SystemExit(1)
          # 每个版本锁条目必须在哈希锁中至少有一个 --hash
          lock_text = Path("requirements.lock").read_text(encoding="utf-8")
          hash_text = Path("requirements.lock.hashes").read_text(encoding="utf-8")
          hash_names = {
              m.group(1).replace("_", "-").lower()
              for m in re.finditer(r"^([A-Za-z0-9_.\-]+)==[^;\s]+\s+--hash=", hash_text, re.M | re.I)
          }
          bad = sorted(k for k in ver if k not in hash_names)
          if bad:
              print("以下条目在哈希锁中缺少 --hash:", bad)
              raise SystemExit(1)
          print(f"两锁一致：{len(ver)} 个组件版本匹配，且均有 sha256 哈希；"
                f"平台差异项 {sorted(platform_only)}。")
          PY

      - name: Ruff 静态检查（零诊断规则集）
        run: ruff check .

      - name: 运行分片后端契约与卫生门禁
        # C7 媒体浏览器夹具会在测试内替换 RunningHub 调用与输出传输；
        # 仅为通过配置闸门注入本次提交 SHA，不代表真实供应商验收或凭据。
        # QIN-520：日常 PR 只跑 `tests/contracts`（八域契约，AGENTS.md 6.3）
        # 与 `tests/hygiene`（洁净室/白名单/命名门禁）；tests/e2e 真实浏览器长跑、
        # tests/api、tests/runtime、tests/media、tests/canvas、tests/smoke、
        # tests/deployment 与 tests/benchmarks 的全量回归由 release-desktop.yml 承接。
        # QIN-568：改为矩阵分片并行执行；分片参数见 matrix.include.pytest_args，
        # 三片并集必须等于原全量收集（对账数字留档于本票 PR 正文）。
        # --durations=20 持续输出慢用例清单，防止瓶颈再次不可见。
        run: |
          export GW_RUNNINGHUB_API_KEY="${GITHUB_SHA}"
          python -m pytest ${{ matrix.pytest_args }} -v --no-header -p no:cacheprovider --durations=20

  frontend:
    name: Frontend contracts and binary guard
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # QIN-568：前端防漏检查、前端契约回归与二进制白名单扫描与 pytest 分片无关，
    # 移入本独立作业只跑一份；二进制扩展名清单与 allowlist 受
    # tests/hygiene/test_cleanroom_hygiene.py 单一来源门禁逐字约束，不得改动。
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 配置 Python 3.11（脚本门禁运行时）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验前端测试清单完整性（防漏门禁）
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          tracked = set(subprocess.check_output(
              ["git", "ls-files", "tests/frontend/*.mjs"],
              text=True, encoding="utf-8"
          ).splitlines())
          tracked = {line.strip().replace("\\", "/") for line in tracked if line.strip()}

          manifest = Path("tests/frontend/node-files.txt").read_text(encoding="utf-8")
          listed = {line.strip().replace("\\", "/") for line in manifest.splitlines() if line.strip()}

          missing = tracked - listed
          extra = listed - tracked
          if missing or extra:
              if missing:
                  print("发现未在 tests/frontend/node-files.txt 登记的前端测试:", sorted(missing))
              if extra:
                  print("tests/frontend/node-files.txt 中存在多余或未跟踪的条目:", sorted(extra))
              sys.exit(1)
          print(f"前端测试防漏检查通过：{len(listed)} 个测试文件全部已登记。")
          PY

      - name: 运行前端契约回归测试（以 tests/frontend/node-files.txt 登记清单为准）
        run: node --test $(cat tests/frontend/node-files.txt | tr -d '\r')

      - name: 扫描二进制白名单
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import subprocess

          banned_extensions = {
              # 图片 / 截图
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".ico", ".svg",
              # 字体（仅 3 条思源黑体白名单例外）
              ".ttf", ".otf", ".woff", ".woff2", ".eot",
              # 音频 / 视频
              ".mp3", ".wav", ".ogg", ".mp4", ".mov", ".avi", ".mkv",
              # 压缩包
              ".zip", ".gz", ".7z", ".rar", ".tar", ".tgz", ".bz2", ".xz",
              # 可执行文件 / 动态库 / 安装包 / 脚本二进制
              ".exe", ".dll", ".so", ".dylib", ".bin", ".msi", ".app",
              ".bat", ".cmd", ".com", ".scr",
              # 文档类二进制（本地策略超集；与 tests/hygiene/cleanroom_extensions.py 逐项一致）
              ".pdf",
          }
          allowlist = {
              "start.bat",
              "web/vendor/fonts/SourceHanSansCN-Bold.otf",
              "web/vendor/fonts/SourceHanSansCN-Medium.otf",
              "web/vendor/fonts/SourceHanSansCN-Normal.otf",
          }
          violations = []
          # 已跟踪文件不受忽略规则豁免；只排除未跟踪且已忽略的本地运行产物。
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--cached", "--others", "--exclude-standard"],
              text=True, encoding="utf-8",
          ).split("\0")
          for relative in sorted(set(tracked) - {""}):
              path = Path(relative)
              if not path.is_file():
                  continue
              if path.suffix.lower() in banned_extensions and relative not in allowlist:
                  violations.append(relative)
          if violations:
              print("发现不在白名单内的二进制资源:")
              print("\n".join(sorted(violations)))
              sys.exit(1)
          print("二进制白名单扫描通过；允许项仅为根 start.bat 和 3 个 Source Han Sans CN 字体精确路径。")
          PY

  desktop:
    name: Windows desktop Rust gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # QIN-520：日常 PR 只做 Rust 格式与单测（约 2~3 分钟）。
    # 原先的 `cargo install tauri-cli` + `cargo tauri build --bundles nsis`
    # 与安装包上传（约 18 分钟）已整体下放到 release-desktop.yml，
    # 只在大版本发布（Tag v* 或手动触发）时产出 NSIS 安装包。
    # QIN-568：加 rust-cache 复用 Cargo 构建缓存；pytest 分片提速后本作业
    # 不再被 ubuntu 侧掩盖，缓存可显著缩短二次构建。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 恢复 Cargo 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path clients/desktop/Cargo.toml

      - name: Run desktop unit tests
        run: cargo test --locked --manifest-path clients/desktop/Cargo.toml
