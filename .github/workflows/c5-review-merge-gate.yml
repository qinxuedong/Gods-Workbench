name: C5 Review and Merge Gate

on:
  # 在 PR review 或 CI 完成时重新评估同一条门禁，避免事件先后顺序造成漏合并。
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 要评估的开放 PR 编号
        required: true
        type: number
      review_pass:
        description: 工单负责人已明确回复审核 PASS
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  gate:
    name: C5 tests and review gate
    # 仅在评审或 CI 状态变化时运行；其它 PR 由脚本中的 C5 分支校验直接跳过。
    if: >-
      (github.event_name == 'pull_request_review') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: 评估 C5 测试与交叉审查
        shell: bash
        env:
          DISPATCH_PR: ${{ inputs.pull_request_number }}
          DISPATCH_REVIEW_PASS: ${{ inputs.review_pass }}
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          event_path="${GITHUB_EVENT_PATH:-}"
          pr_number=""
          head_sha=""

          if [[ -z "$event_path" || ! -f "$event_path" ]]; then
            echo "GitHub 事件文件不可读，保持不合并。"
            exit 0
          fi

          case "$event_name" in
            pull_request_review)
              pr_number="$(jq -r '.pull_request.number' "$event_path")"
              head_sha="$(jq -r '.pull_request.head.sha' "$event_path")"
              ;;
            workflow_run)
              workflow_name="$(jq -r '.workflow_run.name' "$event_path")"
              conclusion="$(jq -r '.workflow_run.conclusion // empty' "$event_path")"
              if [[ "$workflow_name" != "CI" ]]; then
                echo "忽略非 CI workflow: $workflow_name"
                exit 0
              fi
              head_sha="$(jq -r '.workflow_run.head_sha' "$event_path")"
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$event_path")"
              if [[ -z "$pr_number" ]]; then
                echo "CI run 未携带开放 PR，保持不合并（conclusion=$conclusion）。"
                exit 0
              fi
              ;;
            workflow_dispatch)
              pr_number="$DISPATCH_PR"
              ;;
            *)
              echo "未知事件，fail closed: $event_name"
              exit 1
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "缺少 PR 编号，保持不合并。"
            exit 0
          fi

          pr_json="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json state,isDraft,author,baseRefName,headRefName,headRefOid,reviews)"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_branch="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_branch="$(jq -r '.headRefName' <<<"$pr_json")"
          head_sha="${head_sha:-$(jq -r '.headRefOid' <<<"$pr_json")}"

          # 只接管 QIN-154 的开放、非草稿 PR；其它 C5 任务不得被本门禁误合并。
          if [[ "$state" != "OPEN" || "$draft" != "false" || "$base_branch" != "master" || "$head_branch" != "feature/c5-t8-review-merge-gate" ]]; then
            echo "不是 QIN-154 可接管的 PR，保持不合并。"
            exit 0
          fi

          pr_author="$(jq -r '.author.login' <<<"$pr_json")"
          review_pass="$(jq -r '
            . as $pr |
            ($pr.author.login) as $author |
            ($pr.reviews // [])
            | map(select(.author.login != $author))
            | sort_by([.author.login, (.submittedAt // "")])
            | group_by(.author.login)
            | map(.[-1])
            | any(.[]; .state == "APPROVED")
          ' <<<"$pr_json")"

          ci_runs="$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$head_sha" --json status,conclusion --limit 20)"
          ci_pass="$(jq -r 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$ci_runs")"

          echo "PR #$pr_number head=$head_sha author=$pr_author review_pass=$review_pass ci_pass=$ci_pass"
          if [[ "$review_pass" != "true" || "$ci_pass" != "true" ]]; then
            echo "测试 PASS 与独立 review PASS 未同时满足，保持不合并。"
            exit 0
          fi

          if [[ "$event_name" != "workflow_dispatch" || "$DISPATCH_REVIEW_PASS" != "true" ]]; then
            echo "已满足 GitHub review 与 CI；仍等待工单负责人明确审核 PASS 后再合并。"
            exit 0
          fi

          # 仅在负责人明确 PASS 后使用当前 head SHA 防止竞态；合并提交由 GitHub 生成，远端 feature 分支随合并删除。
          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$head_sha"
