<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Gods&#39; Workbench Desktop</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="panel">
    <header class="brand">
      <div class="mark" aria-hidden="true">GW</div>
      <div><p class="eyebrow">LOCAL NAS COMPANION</p><h1>连接工作台</h1></div>
    </header>
    <p class="intro">自动搜索当前局域网内的神工坊 NAS。客户端仅保存服务器地址，不保存模型 API 密钥。</p>
    <section aria-labelledby="discovery-title">
      <div class="section-heading"><h2 id="discovery-title">局域网发现</h2><button id="rescan" class="quiet" type="button">重新扫描</button></div>
      <p id="scan-status" class="status" role="status" aria-live="polite">准备扫描局域网……</p>
      <div id="server-list" class="server-list"></div>
    </section>
    <form id="manual-form" class="manual-form">
      <label for="server-url">手动连接</label>
      <div class="form-row"><input id="server-url" name="server-url" type="url" placeholder="http://192.168.0.10:2077" autocomplete="url" required><button type="submit">连接</button></div>
    </form>
    <footer>NAS 服务需要开放端口 2077 和健康检查路径 /healthz。</footer>
  </main>
</body>
</html>
