<!DOCTYPE html>
<html lang="zh-CN" class="h-full overflow-hidden">
<head>
  <link rel="stylesheet" href="/static/vendor/css/fonts.css?v=v0.0.1-alpha-2026">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资产金库与素材池 · Gods' Workbench</title>
  <script src="/static/vendor/js/tailwindcss-cdn.js?v=3.4.17&amp;build=d11003b2f6fb"></script>
  <script src="/static/vendor/js/lucide.js?v=1.16.0"></script>
  <link rel="stylesheet" href="/static/css/base/hardware-design-system.css">
  <style>
    #assetVaultStage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #assetVaultFrame { flex: 1; width: 100%; min-height: 0; border: 0; background: #0a0b10; }
    #assetVaultStatus { margin: 0; padding: 8px 12px; color: #eddab3; font-size: 12px; }
    #assetVaultStatus:empty { display: none; }
    @media (max-width: 700px) { #assetVaultSidebar { display: none !important; } }
  </style>
</head>
<body class="gw-shell bg-[#090a0d] text-slate-200 antialiased h-screen flex flex-col justify-between select-none overflow-hidden px-5">

  <header class="h-[116px] topbar-master-deck border-b border-white/10 px-3 flex flex-col justify-between shrink-0 z-40 relative select-none overflow-hidden py-2" style="min-height: 116px;">
    <div class="absolute inset-0 pointer-events-none z-10 oled-ambient-pixel"></div>
    <div class="absolute inset-0 pointer-events-none z-20 bg-gradient-to-b from-white/[0.07] via-transparent to-black/80"></div>
    <div class="absolute bottom-0 left-0 right-0 h-px topbar-ambient-edge z-20"></div>

    <div class="flex items-center justify-between relative z-30 px-1 pt-0.5">
      <div class="flex items-center space-x-2 shrink-0">
                <!-- 智能体核心按钮 (原关机键位置) -->
        <button class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 via-fuchsia-500 to-amber-300 p-0.5 shadow-[0_0_12px_rgba(236,72,153,0.7),0_0_6px_rgba(34,211,238,0.9)] hover:scale-110 active:scale-95 transition flex items-center justify-center cursor-pointer shrink-0 launch-orb-btn" title="智能体核心总线 (Agent Core)">
          <div class="w-full h-full rounded-full bg-black/85 flex items-center justify-center">
            <div class="w-3 h-3 rounded-full bg-gradient-to-r from-cyan-300 to-pink-400 animate-spin"></div>
          </div>
        </button>
        <div class="h-4 w-px bg-white/10"></div>
        <div class="flex items-center space-x-1.5">
          <span class="font-bold text-sm tracking-wider text-slate-100 uppercase">GODS'</span>
          <span class="font-mono font-bold text-sm text-[#dfc384] tracking-widest">WORKBENCH</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-black/60 border border-[#dfc384]/30 text-[#eddab3]">SYS.02 PRO</span>
        </div>
        <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-md bg-[#0a0c10] border border-white/10 shadow-inner">
          <span class="text-[9px] font-mono text-amber-300 font-semibold" id="gwOnlineStatus" data-gw-degradation="not_integrated" title="读取真实探针 GET /api/observability/health">探测中…</span>
            <span class="relative flex h-2 w-2">
              <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400 animate-pulse shadow-[0_0_6px_#f59e0b]"></span>
            </span>
        </div>


        <div class="trapezoid-uv-housing ml-1.5" title="CPU 负载监视表">
          <div class="uv-dial-backlight"></div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 148 48">
            <path d="M 2 8 A 6 6 0 0 1 8 2 L 134 2 A 4 4 0 0 1 138 5 L 146 43 A 4 4 0 0 1 142 47 L 8 47 A 6 6 0 0 1 2 41 Z"
                  fill="#0b0d13" stroke="#2e3547" stroke-width="1.5" stroke-linejoin="round" />
            <text x="10" y="11" font-family="'Source Han Sans CN', monospace" font-size="7.5" font-weight="700" fill="#dfc384" letter-spacing="0.5">CPU</text>
            <path d="M 48.32 39.66 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />
            <path d="M 92.48 28.32 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
            <polygon id="svgNeedleCPU" points="73.3,48 74.7,48 74.3,19 73.7,19" fill="#ffffff" filter="drop-shadow(0 0 2.5px #fae2c8)" transform="rotate(-11.5 74 48)" />
          </svg>
          <div class="uv-bottom-hub">
            <span class="uv-hub-percent text-[#fae2c8]" id="cpuValText">未接入</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="flex items-center space-x-1.5 bg-[#07080b] px-3 py-1 rounded-lg border border-white/10 shadow-inner">
          <button class="text-slate-400 hover:text-[#dfc384] p-0.5 transition"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
          <div class="flex items-center space-x-2 px-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#dfc384] shadow-[0_0_6px_#dfc384] animate-pulse"></span>
            <span class="text-[10px] font-mono font-bold text-[#eddab3] tracking-wider">ASSET REPOSITORY VAULT · RAID-06 POOL</span>
          </div>
          <button class="text-slate-400 hover:text-[#dfc384] p-0.5 transition"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="trapezoid-uv-housing mr-1.5" title="RAM 内存监视表">
          <div class="uv-dial-backlight"></div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 148 48">
            <path d="M 146 8 A 6 6 0 0 0 140 2 L 14 2 A 4 4 0 0 0 10 5 L 2 43 A 4 4 0 0 0 6 47 L 140 47 A 6 6 0 0 0 146 41 Z"
                  fill="#0b0d13" stroke="#2e3547" stroke-width="1.5" stroke-linejoin="round" />
            <text x="138" y="11" text-anchor="end" font-family="'Source Han Sans CN', monospace" font-size="7.5" font-weight="700" fill="#dfc384" letter-spacing="0.5">RAM</text>
            <path d="M 48.32 39.66 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />
            <path d="M 92.48 28.32 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
            <polygon id="svgNeedleRAM" points="73.3,48 74.7,48 74.3,19 73.7,19" fill="#ffffff" filter="drop-shadow(0 0 2.5px #38bdf8)" transform="rotate(25.9 74 48)" />
          </svg>
          <div class="uv-bottom-hub">
            <span class="uv-hub-percent text-cyan-300" id="ramValText">未接入</span>
          </div>
        </div>

        <div class="flex items-center space-x-1 bg-[#090b0e] p-1 rounded-lg border border-white/5">
          <button class="hw-round-btn w-7 h-7" title="停止"><div class="hw-round-inner w-4 h-4"><div class="w-1.5 h-1.5 bg-slate-400 rounded-sm"></div></div></button>
          <button class="hw-round-btn active w-7 h-7" title="运行"><div class="hw-round-inner w-4 h-4"><svg class="w-2.5 h-2.5 text-[#dfc384]" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div></button>
          <button class="hw-round-btn w-7 h-7" title="下一步"><div class="hw-round-inner w-4 h-4"><i data-lucide="skip-forward" class="w-2.5 h-2.5 text-slate-400"></i></div></button>
        </div>

        <div class="h-4 w-px bg-white/10"></div>
        <div class="px-2.5 py-1.5 rounded bg-[#06070a] border border-[#dfc384]/30 font-mono text-xs text-[#eddab3] font-bold shadow-inner flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#dfc384] shadow-[0_0_6px_#dfc384]"></span>
          <span id="masterDeckClock">00:00:00</span>
        </div>
        <button type="button" id="masterDeckDate" class="shrink-0 min-w-[76px] px-2.5 py-1.5 rounded bg-[#06070a] border border-[#dfc384]/45 font-mono text-xs text-[#eddab3] font-bold shadow-inner flex items-center justify-center space-x-1.5 hover:border-[#dfc384] transition" title="打开项目排期日历" aria-label="打开项目排期日历"><i data-lucide="calendar-days" class="w-3.5 h-3.5 text-[#dfc384]" aria-hidden="true"></i><span class="text-slate-500 uppercase" id="masterDeckDateMonth">---</span><span id="masterDeckDateDay">--</span></button>
      </div>
    </div>

    <div class="recessed-deck-slot h-11 rounded-lg flex items-center justify-between px-2.5 relative z-30">
      <div class="flex items-center space-x-2 shrink-0" id="navPillsGroup">
                <a href="index.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="首页 · 控制台">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>首页 · 控制台</span>
        </a>
        <a href="projects.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="项目中心">
          <i data-lucide="folder-kanban" class="w-3.5 h-3.5"></i>
          <span>项目中心</span>
        </a>
        <a href="workshop.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="影视工坊">
          <i data-lucide="film" class="w-3.5 h-3.5"></i>
          <span>影视工坊</span>
        </a>
        <a href="production.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="剧集制片">
          <i data-lucide="clapperboard" class="w-3.5 h-3.5"></i>
          <span>剧集制片</span>
        </a>
        <a href="agents.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="智能体">
          <i data-lucide="bot" class="w-3.5 h-3.5"></i>
          <span>智能体</span>
        </a>
        <a href="storyboard.html?view=canvas" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="画布">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>画布/工具</span>
        </a>
        <a href="assets.html" class="pill-capsule-active px-3.5 py-1.5 text-xs tracking-wide  flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="资产库">
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
          <span>资产库</span>
        </a>
        <a href="collab.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="协作">
          <i data-lucide="users" class="w-3.5 h-3.5"></i>
          <span>协作</span>
        </a>
        <a href="workflow-workbench.html" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="工作流">
          <i data-lucide="workflow" class="w-3.5 h-3.5"></i><span>工作流</span>
        </a>
        <a href="index.html?view=settings" class="pill-capsule-inactive px-3.5 py-1.5 text-xs tracking-wide font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="系统设置">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          <span>设置</span>
        </a>
      </div>

      <div class="flex items-center space-x-4 shrink-0">
        <div class="flex items-center space-x-2">
          <span class="text-[9px] font-mono text-slate-400 font-bold">FLOW</span>
          <div class="hw-fader-track-horizontal w-28">
            <div class="hw-fader-glow-bar" style="width: 0%;"></div>
            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>
          <span class="text-[9px] font-mono text-amber-300 font-bold" id="flowPipelineReadout" data-gw-degradation="not_integrated" title="真实数据源：GET /api/observability/health">未接入</span>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-[9px] font-mono text-slate-400 font-bold">BUFFER</span>
          <div class="hw-fader-track-horizontal w-24">
            <div class="hw-fader-glow-bar" style="width: 0%; background: linear-gradient(90deg, #38bdf8 0%, #2dd4bf 100%);"></div>
            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>
          <span class="text-[9px] font-mono text-amber-300 font-bold" id="bufferReadout" data-gw-degradation="not_integrated" title="真实数据源：GET /api/observability/health">未接入</span>
        </div>
      </div>

      <div class="flex items-center space-x-3 shrink-0">
        <div class="flex items-center space-x-1.5">
          <span class="text-[8px] font-mono text-slate-400 font-bold">AUTO</span>
          <div class="hw-slide-toggle active" onclick="this.classList.toggle('active')"><div class="hw-slide-peg"></div></div>
          <span class="text-[8px] font-mono text-[#dfc384] font-bold">MANUAL</span>
        </div>
        <div class="h-3.5 w-px bg-white/10"></div>
                <!-- 拟物头像键帽 (原智能体核心位置，替换左下角登录用户，无文字只显头像) -->
        <div class="hw-avatar-keycap ml-1 cursor-pointer hover:scale-105 active:scale-95 transition" title="认证状态未接入：点击打开认证中心查看真实登录状态" data-gw-identity="unverified">
          <div class="hw-avatar-keycap-inner">
            <i data-lucide="shield-check" class="w-4 h-4 text-[#eddab3]"></i>
          </div>
          <span class="hw-avatar-keycap-status"></span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden min-h-0">
    <!-- LEFT: 资产类别与标签 -->
    <aside id="assetVaultSidebar" class="w-64 bg-[#08090d] border-r border-[#191c24] flex flex-col shrink-0 z-30 h-full min-h-0">
      <div class="p-2 border-b border-white/5 shrink-0">
        <div class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-[#141720] border border-[#dfc384]/35 text-[#eddab3] text-xs font-semibold shadow-md">
          <div class="flex items-center space-x-2">
            <i data-lucide="database" class="w-4 h-4 text-[#dfc384]"></i>
            <span>资产仓储类别</span>
          </div>
          <span class="text-[8px] font-mono text-[#dfc384]" id="assetCategoryTotal"></span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs" id="assetCategories">
        <!-- 动态生成 -->
      </div>

      <div class="p-2.5 bg-[#050608] border-t border-white/5 shrink-0">
        <button class="tactile-keycap w-full py-1.5 rounded-lg text-xs font-bold text-[#eddab3] flex items-center justify-center space-x-1" onclick="WorkbenchAssets.uploadAsset()">
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>导入外部资产文件</span>
        </button>
      </div>
    </aside>

    <!-- MAIN: 资产金库网格与详情 -->
    <main id="assetVaultStage">
      <p id="assetVaultStatus" role="status" aria-live="polite">正在加载资产库…</p>
      <iframe id="assetVaultFrame" title="资产库" data-src="/static/asset-manager.html?embedded=1&amp;vault=1"></iframe>
    </main>
  </div>

  <script src="/static/js/core/degradation.js?v=v0.0.1-alpha-2026"></script>
  <script src="/static/js/core/hardware-telemetry.js"></script>
  <script src="/static/js/controllers/assets-controller.js"></script>
<script src="/static/js/core/workbench-shell.js"></script>
</body>
</html>
