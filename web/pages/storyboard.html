          <button class="canvas-rail-item hw-btn" data-rail-type="tool" data-tool-id="prompts" type="button" onclick="switchToolTab(this, 'prompts')" aria-pressed="false"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i><span>提示词助手</span></button>
        </section>

        <!-- 分镜场次目录（仅在分镜矩阵工具激活时展示） -->
        <div id="storyboardSceneNavContainer" class="p-2 border-t border-white/5 space-y-1.5" style="display:none;">
          <div class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg bg-[#141720] border border-[#dfc384]/35 text-[#eddab3] gw-type-body-sm font-semibold shadow-md">
            <div class="flex items-center space-x-2">
              <i data-lucide="list-video" class="w-3.5 h-3.5 text-[#dfc384]"></i>
              <span>分镜场次</span>
            </div>
            <span class="gw-type-body-sm font-mono text-[#dfc384]">共 4 幕</span>
          </div>
          <div class="space-y-1 pt-1" id="storyboardSceneNav">
            <!-- 场次导航条目由 JS 动态渲染 -->
          </div>
        </div>
      </div>
      <!-- 底部操作栏（分镜矩阵模式下展示导出脚本） -->
      <div class="p-2.5 bg-[#050608] border-t border-white/5 shrink-0" id="storyboardExportFooter" style="display:none;">
        <button class="hw-btn hw-btn-gold w-full flex items-center justify-center space-x-1" onclick="WorkbenchStoryboard.exportPdf()">
          <i data-lucide="file-down" class="w-3.5 h-3.5 text-[#0a0c10]"></i>
          <span>导出导演分镜脚本</span>
        </button>
      </div>
    </aside>

    <!-- MAIN WORKSPACE: 多视图主工作区 -->
    <main id="storyboardMain" class="flex-1 p-2.5 min-h-0 flex flex-col space-y-2 overflow-hidden">
      <!-- 视图 1：画布总览 (嵌入 iframe) -->

      <iframe id="canvasOverviewFrame" class="canvas-overview-frame" title="画布总览" src="about:blank" scrolling="no" hidden></iframe>

      <!-- 视图 2：画布工作台承接面 (Canvas Workspace) -->
      <div id="canvasWorkspaceStage" class="canvas-workspace-stage flex flex-col flex-1 min-h-0 space-y-2" hidden>
        <!-- 顶部信息栏 & 面包屑 -->
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-3">
            <button class="hw-btn hw-btn-sm text-slate-300 hover:text-white flex items-center space-x-1" onclick="exitCanvasWorkspace()" title="返回画布总览">
              <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-[#dfc384]"></i>
              <span>返回总览</span>
            </button>
            <div class="h-3.5 w-px bg-white/10"></div>
            <div class="flex items-center space-x-2">
              <i data-lucide="layout-template" class="w-4 h-4 text-[#dfc384]"></i>
              <h2 class="text-slate-100 gw-type-section" id="workspaceCanvasTitle">当前画布</h2>
              <span class="gw-type-body-sm font-mono px-2 py-0.5 rounded bg-black/60 border border-[#dfc384]/30 text-[#eddab3]" id="workspaceCanvasIdTag">cv-xxxx</span>
              <span class="gw-type-body-sm font-mono text-slate-400" id="workspaceCanvasVersion">v1</span>
            </div>
          </div>
          <div class="flex items-center space-x-2 gw-type-body-sm font-mono">
            <span class="text-slate-400" id="workspaceProjectBadge">项目: default</span>
            <div class="h-3.5 w-px bg-white/10"></div>
            <button class="hw-btn hw-btn-sm text-slate-300 hover:text-white flex items-center space-x-1" id="btnExportCanvasGodmap" title="导出拓扑 JSON">
              <i data-lucide="download" class="w-3.5 h-3.5 text-[#dfc384]"></i>
              <span>导出 .godmap</span>
            </button>
          </div>
        </div>

        <!-- 工作台拓扑舞台（Task 3 将对其渲染工作流同源节点与连线动效） -->
        <div class="flex-1 min-h-0 relative overflow-hidden rounded-xl border border-white/10 bg-[#080a0e]" id="canvasTopologyContainer">
          <div class="absolute inset-0 infinite-grid-bg" id="canvasTopologyStage">
            <!-- 连线 SVG 层 -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="canvasTopologyWiresSvg" style="z-index: 10;"></svg>
            <!-- 节点容器层 -->
            <div class="absolute inset-0" id="canvasTopologyNodesLayer" style="z-index: 20;"></div>
          </div>
        </div>
      </div>

      <!-- 视图 3：分镜卡片网格矩阵 -->
      <div id="storyboardMatrixContent" class="storyboard-matrix-content flex flex-col flex-1 min-h-0 space-y-2">
        <!-- 顶栏批量控制与网格切换 -->
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
              <i data-lucide="film" class="w-4 h-4 text-[#dfc384]"></i>
              <h2 class="text-slate-100 gw-type-title" id="storyboardTitle">第 03 幕 · 钛金圣殿对峙 (共 6 个分镜)</h2>
            </div>
            <div class="h-3.5 w-px bg-white/10"></div>
            <span class="gw-type-body-sm font-mono text-amber-300" data-gw-degradation="not_integrated">渲染端点未接入（未纳入当前切片）</span>
          </div>

          <div class="flex items-center space-x-2 gw-type-body-sm font-mono">
            <button type="button" class="hw-btn hw-btn-sm flex items-center space-x-1" id="btnSyncAgentStoryboard" onclick="WorkbenchStoryboard.syncLatestAgentStoryboard()" title="读取当前项目最新已审核文字分镜产物并生成占位卡片">
              <i data-lucide="bot" class="w-3 h-3 text-cyan-300"></i>
              <span>从智能体同步文字分镜</span>
            </button>
            <span id="agentStoryboardSyncStatus" class="gw-type-body-sm font-mono text-slate-400" role="status" aria-live="polite" data-gw-degradation="not_integrated">未同步</span>
            <button type="button" class="hw-btn hw-btn-sm hw-btn-gold flex items-center space-x-1" id="btnSyncTimeline" onclick="WorkbenchStoryboard.syncTimeline()" title="按分镜顺序写入当前剧集的 OpenFilm timeline_manifest">
              <i data-lucide="list-video" class="w-3 h-3 text-[#0a0c10]"></i>
              <span>同步至时间线</span>
            </button>
            <span id="timelineSyncStatus" class="gw-type-body-sm font-mono text-slate-400" role="status" aria-live="polite" data-gw-degradation="not_integrated">未同步</span>
            <div class="h-3.5 w-px bg-white/10"></div>
            <button class="hw-btn flex items-center space-x-1" onclick="WorkbenchStoryboard.batchGenerate()">
              <i data-lucide="play" class="w-3 h-3 text-[#dfc384]"></i>
              <span>批量渲染所有分镜</span>
            </button>
            <button class="hw-btn hw-btn-gold flex items-center space-x-1" onclick="WorkbenchStoryboard.addNewShot()">
              <i data-lucide="plus" class="w-3 h-3 text-[#dfc384]"></i>
              <span>追加镜头</span>
            </button>
          </div>
        </div>

        <!-- 分镜网格容器 -->
        <div class="flex-1 min-h-0 overflow-y-auto pr-1">
          <div class="grid grid-cols-3 gap-2.5" id="storyboardGrid" data-contact-sheet="runtime" aria-label="分镜与多 Take 接触印样">
            <!-- 动态渲染 6 个分镜卡片 -->
          </div>
        </div>
      </div>


      <!-- 视图 4：独立创作工具面板 -->
      <div id="toolPanelContainer" class="tool-panel-container flex flex-col flex-1 min-h-0 space-y-2" hidden>
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-2">
            <i data-lucide="wrench" class="w-4 h-4 text-[#dfc384]" id="toolPanelIcon"></i>
            <h2 class="text-slate-100 gw-type-section" id="toolPanelTitle">创作工具</h2>
          </div>
          <span class="gw-type-body-sm font-mono text-[#dfc384]">GODS' TOOLKIT</span>
        </div>
        <div class="flex-1 min-h-0 rounded-xl border border-white/10 bg-[#0b0d13] p-6 flex flex-col items-center justify-center text-center space-y-4" id="toolPanelBody">
          <!-- 动态工具内容 -->
        </div>
      </div>
    </main>
  </div>

  <script>
    (function initStoryboardRoute() {
    const storyboardParams = new URLSearchParams(window.location.search);
    const matrix = document.getElementById('storyboardMatrixContent');
    const frame = document.getElementById('canvasOverviewFrame');
    const workspaceStage = document.getElementById('canvasWorkspaceStage');
    const toolContainer = document.getElementById('toolPanelContainer');
    const sceneNavContainer = document.getElementById('storyboardSceneNavContainer');
    const exportFooter = document.getElementById('storyboardExportFooter');
    const canvasContextKeys = ['project_id', 'project', 'entity_id', 'canvas_id'];

    function embeddedCanvasRoute(path, extraParams = {}, includeHash = false) {
      const url = new URL(path, location.origin);
      url.searchParams.set('embedded', '1');
      url.searchParams.set('v', '20261010-v2');
      canvasContextKeys.forEach(key => {
        const value = storyboardParams.get(key);
        if (value) url.searchParams.set(key, value);
      });
      Object.entries(extraParams).forEach(([key, value]) => url.searchParams.set(key, String(value)));
      if (includeHash) url.hash = 'embedded=1';
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function hideAllMainViews() {
      if (matrix) matrix.hidden = true;
      if (frame) frame.hidden = true;
      if (workspaceStage) workspaceStage.hidden = true;
      if (toolContainer) toolContainer.hidden = true;
    }

    window.openCanvasOverview = function openCanvasOverview(button, filter) {
      hideAllMainViews();
      document.body.classList.add('canvas-overview-mode');
      if (sceneNavContainer) sceneNavContainer.style.display = 'none';
      if (exportFooter) exportFooter.style.display = 'none';

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => {
        item.classList.toggle('active', item === button);
        item.classList.toggle('engaged', item === button);
        item.setAttribute('aria-pressed', String(item === button));
      });

      if (frame) {
        frame.hidden = false;
        frame.title = '画布总览';
        const currentSrc = frame.getAttribute('src');
        const targetUrl = embeddedCanvasRoute('/static/canvas-list.html', { layout: 'overview', filter }, true);
        if (!currentSrc || currentSrc === 'about:blank') {
          frame.src = targetUrl;
        } else {
          frame.contentWindow?.postMessage({ type: 'canvas-filter', filter }, location.origin);
        }
      }
      document.title = '画布 · Gods\' Workbench';
    };

    window.switchToolTab = function switchToolTab(button, toolId) {
      hideAllMainViews();
      document.body.classList.remove('canvas-overview-mode');

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => {
        item.classList.toggle('active', item === button);
        item.classList.toggle('engaged', item === button);
        item.setAttribute('aria-pressed', String(item === button));
      });

      if (toolId === 'storyboard') {
        if (matrix) matrix.hidden = false;
        if (sceneNavContainer) sceneNavContainer.style.display = 'block';
        if (exportFooter) exportFooter.style.display = 'block';
        document.title = '分镜画布矩阵 · Gods\' Workbench';
      } else {
        if (sceneNavContainer) sceneNavContainer.style.display = 'none';
        if (exportFooter) exportFooter.style.display = 'none';
        if (toolContainer) {
          toolContainer.hidden = false;
          renderToolPanelContent(toolId);
        }
      }
    };

    function renderToolPanelContent(toolId) {
      const titleEl = document.getElementById('toolPanelTitle');
      const bodyEl = document.getElementById('toolPanelBody');
      if (!titleEl || !bodyEl) return;

      if (toolId === 'radar') {
        titleEl.textContent = '2D 顶视机位雷达 (Previs 预演)';
        renderRadarPanel(bodyEl);
        window.setTimeout(() => {
          if (!toolContainer?.hidden) renderRadarPanel(bodyEl);
        }, 0);
      } else if (toolId === 'palette') {
        titleEl.textContent = '色彩管理与调色板';
        bodyEl.innerHTML = `
          <div class="max-w-md space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-[#38bdf8]/10 border border-[#38bdf8]/30 flex items-center justify-center mx-auto text-[#38bdf8]">
              <i data-lucide="palette" class="w-8 h-8"></i>
            </div>
            <h3 class="text-slate-100 gw-type-section">黑金影视色彩调色系统</h3>
            <p class="text-slate-400 gw-type-body-sm leading-relaxed">
              统一管理影视镜头色调预设、LUT 配置文件与调色板，确保项目全链路视觉一致性。
            </p>
          </div>
        `;
      } else if (toolId === 'prompts') {
        titleEl.textContent = '提示词助手';
        bodyEl.innerHTML = `
          <div class="max-w-md space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-[#c084fc]/10 border border-[#c084fc]/30 flex items-center justify-center mx-auto text-[#c084fc]">
              <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <h3 class="text-slate-100 gw-type-section">影视镜头提示词结构化生成器</h3>
            <p class="text-slate-400 gw-type-body-sm leading-relaxed">
              集成景别、机位角度、灯光氛围、画风品质等影视术语标准化模板，一键赋能工作流。
            </p>
          </div>
        `;
      }
      if (window.lucide) lucide.createIcons();
    }

    function radarCameraForShot(shot) {
      if (!shot || typeof shot !== 'object') return null;
      const metadata = shot.metadata && typeof shot.metadata === 'object' ? shot.metadata : {};
      const camera = shot.camera_radar || shot.camera_position || metadata.camera || metadata.camera_position;
      return camera && typeof camera === 'object' ? camera : null;
    }

    function radarSubjectForShot(shot) {
      if (!shot || typeof shot !== 'object') return null;
      const metadata = shot.metadata && typeof shot.metadata === 'object' ? shot.metadata : {};
      const subject = shot.subject_position || shot.subject || metadata.subject || metadata.subject_position;
      return subject && typeof subject === 'object' ? subject : null;
    }

    function renderRadarPanel(bodyEl) {
      if (!bodyEl) return;
      const storyboardState = window.WorkbenchStoryboard?.getState?.() || {shots: []};
      const shots = Array.isArray(storyboardState.shots) ? storyboardState.shots : [];
      const requestedShotId = String(storyboardParams.get('shot_id') || '').trim();
      const shotIndex = Math.max(0, shots.findIndex(shot => String(shot?.id || shot?.shot_id || '') === requestedShotId));
      const shot = shots[shotIndex] || shots[0] || null;
      const camera = radarCameraForShot(shot);
      const subject = radarSubjectForShot(shot);
      const previousShot = shotIndex > 0 ? shots[shotIndex - 1] : null;
      const previousCamera = radarCameraForShot(previousShot);
      const projectId = String(storyboardState.projectId || storyboardParams.get('project_id') || '').trim();
      const shotId = String(shot?.id || shot?.shot_id || '').trim();

      if (!shot || !camera || !subject || !window.TopDownRadar || !window.CameraRadarNode) {
        bodyEl.innerHTML = `
          <div class="radar-panel-shell space-y-3" data-radar-panel>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-[#dfc384]/10 border border-[#dfc384]/30 flex items-center justify-center text-[#dfc384]"><i data-lucide="compass" class="w-6 h-6"></i></div>
              <div><h3 class="text-slate-100 gw-type-section">原生 SVG 2D 顶视机位雷达</h3><p class="text-slate-400 gw-type-body-sm">读取分镜的 ASC 机位坐标、主体锚点与动作轴。</p></div>
            </div>
            <div class="p-4 rounded-xl border border-amber-300/20 bg-[#07080b] text-amber-200 gw-type-body-sm" data-gw-degradation="not_integrated">${shot ? '当前分镜缺少可用机位或主体坐标，雷达保持未接入。' : '分镜数据未接入，雷达等待真实机位元数据。'}</div>
          </div>`;
        window.lucide?.createIcons();
        return null;
      }

      const node = window.CameraRadarNode.createCameraRadarNode({
        entity_id: shot.entity_id || `camera-radar-${shotId}`,
        project_id: projectId,
        canvas_id: shot.canvas_id || storyboardParams.get('canvas_id') || '',
        shot_id: shotId,
        camera,
        subject,
        previousCamera,
        axisAngle: shot.action_axis ?? shot.axis_angle ?? shot.metadata?.axis_angle ?? 0
      });
      const focusUrl = window.CameraRadarNode.buildCanvasFocusUrl(node, {origin: location.origin});
      // Deep-Link 形态：canvas.html?project_id=...&focus_node=...，保持项目上下文。
      const model = window.TopDownRadar.createRadarModel(camera, {
        subject,
        previousCamera,
        axisAngle: node.metadata.axis_angle
      });
      bodyEl.innerHTML = `
        <div class="radar-panel-shell space-y-3" data-radar-panel data-radar-alert="${model.crossesAxis ? 'axis-crossing' : 'safe'}">
          <div class="radar-panel-toolbar">
            <div><h3 class="text-slate-100 gw-type-section">原生 SVG 2D 顶视机位雷达</h3><p class="text-slate-400 gw-type-body-sm">视锥 FOV、主体朝向与相邻镜头动作轴实时核验。</p></div>
            <a class="hw-btn hw-btn-sm hw-btn-gold" data-radar-canvas-link href="${focusUrl}">在画布中调走位</a>
          </div>
          <div class="radar-panel-meta"><span>镜头 <strong>${shotId}</strong></span><span>heading <strong>${model.camera.heading}°</strong></span><span>FOV <strong>${model.camera.fov}°</strong></span><span data-radar-status class="${model.crossesAxis ? 'text-red-300' : 'text-emerald-300'}">${model.crossesAxis ? '180° 越轴警示' : '动作轴安全'}</span></div>
          <div data-radar-host aria-label="${model.crossesAxis ? '180 度动作轴越轴警示' : '2D 顶视机位雷达'}"></div>
          <div class="radar-shot-list" data-radar-shot-links aria-label="相邻镜头雷达入口"></div>
        </div>`;
      window.TopDownRadar.renderRadar(bodyEl.querySelector('[data-radar-host]'), camera, {
        subject,
        previousCamera,
        axisAngle: node.metadata.axis_angle
      });
      const links = bodyEl.querySelector('[data-radar-shot-links]');
      shots.forEach((candidate, index) => {
        const candidateCamera = radarCameraForShot(candidate);
        const candidateSubject = radarSubjectForShot(candidate);
        if (!candidateCamera || !candidateSubject) return;
        const candidateId = String(candidate.id || candidate.shot_id || '').trim();
        const candidateNode = window.CameraRadarNode.createCameraRadarNode({
          entity_id: candidate.entity_id || `camera-radar-${candidateId}`,
          project_id: projectId,
          canvas_id: candidate.canvas_id || node.canvas_id,
          shot_id: candidateId,
          camera: candidateCamera,
          subject: candidateSubject,
          previousCamera: index > 0 ? radarCameraForShot(shots[index - 1]) : null,
          axisAngle: candidate.action_axis ?? candidate.axis_angle ?? candidate.metadata?.axis_angle ?? 0
        });
        const link = document.createElement('a');
        link.className = 'hw-btn hw-btn-sm radar-shot-link';
        link.href = window.CameraRadarNode.buildCanvasFocusUrl(candidateNode, {origin: location.origin});
        link.dataset.radarAlert = candidateNode.metadata.crosses_axis ? 'axis-crossing' : 'safe';
        link.textContent = candidateId;
        links?.appendChild(link);
      });
      window.lucide?.createIcons();
      return node;
    }

    window.__gwRenderRadarPanel = renderRadarPanel;

    function enhanceStoryboardRadarLinks() {
      const storyboardState = window.WorkbenchStoryboard?.getState?.();
      const grid = document.getElementById('storyboardGrid');
      if (!storyboardState || !grid || !window.CameraRadarNode) return;
      (storyboardState.shots || []).forEach(shot => {
        const shotId = String(shot?.id || shot?.shot_id || '').trim();
        const camera = radarCameraForShot(shot);
        const subject = radarSubjectForShot(shot);
        if (!shotId || !camera || !subject) return;
        const card = [...grid.querySelectorAll('[data-storyboard-shot]')].find(item => item.dataset.storyboardShot === shotId);
        if (!card || card.querySelector('[data-shot-radar-link]')) return;
        const node = window.CameraRadarNode.createCameraRadarNode({
          entity_id: shot.entity_id || `camera-radar-${shotId}`,
          project_id: storyboardState.projectId || storyboardParams.get('project_id') || '',
          canvas_id: shot.canvas_id || storyboardParams.get('canvas_id') || '',
          shot_id: shotId,
          camera,
          subject
        });
        const target = card.querySelector('.border-t') || card.lastElementChild;
        if (!target) return;
        const link = document.createElement('a');
        link.className = 'hw-btn hw-btn-sm radar-node-inline-link';
        link.dataset.shotRadarLink = shotId;
        link.href = window.CameraRadarNode.buildCanvasFocusUrl(node, {origin: location.origin});
        link.textContent = '调机位';
        (target.querySelector?.('.flex.items-center') || target).appendChild(link);
      });
    }

    window.setTimeout(enhanceStoryboardRadarLinks, 0);
    const radarGrid = document.getElementById('storyboardGrid');
    if (radarGrid && window.MutationObserver) {
      new MutationObserver(enhanceStoryboardRadarLinks).observe(radarGrid, {childList: true, subtree: true});
    }

    window.exitCanvasWorkspace = function exitCanvasWorkspace() {
      const allBtn = document.querySelector('[data-canvas-rail="all"]');
      if (allBtn) openCanvasOverview(allBtn, 'all');
    };

    // 默认路由判断
    if (storyboardParams.get('embedded') === '1') {
      document.body.classList.add('embedded');
    }
    const reqView = storyboardParams.get('view');
    if (reqView === 'canvas' || !reqView) {
      // 默认或明确为 canvas 时进入画布总览
      const allBtn = document.querySelector('[data-canvas-rail="all"]');
      openCanvasOverview(allBtn, 'all');
    } else if (reqView === 'storyboard') {
      const sbBtn = document.querySelector('[data-tool-id="storyboard"]');
      switchToolTab(sbBtn, 'storyboard');
    } else if (reqView === 'radar') {
      const radarBtn = document.querySelector('[data-tool-id="radar"]');
      switchToolTab(radarBtn, 'radar');
    }

    // 监听子 iframe 发来的消息 (如 canvas-filter、canvas-open)
    if (window.__gwCanvasMsgHandler) window.removeEventListener('message', window.__gwCanvasMsgHandler);
    window.__gwCanvasMsgHandler = event => {
      if (event.origin && event.origin !== location.origin) return;
      if (event.data?.type === 'canvas-filter') {
        frame?.contentWindow?.postMessage(event.data, location.origin);
        document.querySelectorAll('[data-canvas-rail]').forEach(item => {
          const selected = item.dataset.canvasRail === event.data.filter;
          item.classList.toggle('active', selected);
          item.classList.toggle('engaged', selected);
          item.setAttribute('aria-pressed', String(selected));
        });
      } else if (event.data?.type === 'canvas-created') {
        const filter = ['all', 'classic', 'project', 'reference'].includes(event.data.filter)
          ? event.data.filter
          : 'all';
        frame?.contentWindow?.postMessage({ type: 'canvas-filter', filter }, location.origin);
        document.querySelectorAll('[data-canvas-rail]').forEach(item => {
          const selected = item.dataset.canvasRail === filter;
          item.classList.toggle('active', selected);
          item.classList.toggle('engaged', selected);
          item.setAttribute('aria-pressed', String(selected));
        });
      } else if (event.data?.type === 'canvas-open') {
        // Task 3: 捕获打开画布事件并进入画布工作台
        handleCanvasOpen(event.data.canvas);
      }
    };
    window.addEventListener('message', window.__gwCanvasMsgHandler);

    function handleCanvasOpen(canvas) {
      if (!canvas) return;
      hideAllMainViews();
      document.body.classList.add('canvas-overview-mode');
      if (sceneNavContainer) sceneNavContainer.style.display = 'none';
      if (exportFooter) exportFooter.style.display = 'none';

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => {
        item.classList.remove('active', 'engaged');
        item.setAttribute('aria-pressed', 'false');
      });

      if (workspaceStage) {
        workspaceStage.hidden = false;
        const titleEl = document.getElementById('workspaceCanvasTitle');
        const idTagEl = document.getElementById('workspaceCanvasIdTag');
        const verEl = document.getElementById('workspaceCanvasVersion');
        const projBadge = document.getElementById('workspaceProjectBadge');
        if (titleEl) titleEl.textContent = canvas.title || '未命名画布';
        if (idTagEl) idTagEl.textContent = canvas.id || 'cv-xxxx';
        if (verEl) verEl.textContent = canvas.version ? `v${canvas.version}` : 'v1';
        if (projBadge) projBadge.textContent = `项目: ${canvas.project || 'default'}`;

        document.title = `${canvas.title || '画布'} · 工作台`;

        // 触发工作台拓扑渲染（Task 3 将接入）
        window.dispatchEvent(new CustomEvent('gw:render-canvas-workspace', { detail: canvas }));
      }
    }
    if (window.lucide) lucide.createIcons();
    })();
  </script>
