  <style>
    body.embedded > header { display: none; }
    body.embedded { padding-left: 0; padding-right: 0; }
    body.canvas-overview-mode #storyboardMain { padding: 0; gap: 0; }
    .canvas-overview-frame { display: block; flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #090a0d; }
    .canvas-overview-frame[hidden], .storyboard-matrix-content[hidden], .canvas-workspace-stage[hidden], .tool-panel-container[hidden] { display: none !important; }

    .canvas-rail-heading { padding: 3px 7px 5px; color: #dfc384; font-family: var(--gw-font-mono); font-size: var(--gw-type-body-sm) !important; font-weight: 700; line-height: 1.2; letter-spacing: 0.5px; }
    .canvas-rail-heading.tools { margin-top: 2px; color: #dfc384; }
    .canvas-rail-item { width: 100%; min-height: 34px; margin: 2px 0; padding: 6px 8px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: #101319; color: #f8fafc; font-family: var(--gw-font-body); font-size: var(--gw-type-body-md) !important; font-weight: var(--gw-weight-medium); line-height: var(--gw-leading-body-md); text-align: left; cursor: pointer; transition: border-color .16s ease, box-shadow .16s ease, color .16s ease, background-color .16s ease; }
    .canvas-rail-item:hover { color: #eddab3; border-color: rgba(223,195,132,.45); background: #14171f; }
    .canvas-rail-item.active { color: #dfc384; border-color: #dfc384; background: #14171f; box-shadow: 0 0 8px rgba(223,195,132,.12), inset 0 0 0 1px rgba(223,195,132,.08); }
    .canvas-rail-item:focus-visible { outline: 2px solid rgba(223,195,132,.72); outline-offset: 2px; }
    .canvas-rail-item > svg { width: 14px; height: 14px; flex: 0 0 14px; }
    #storyboardWorkspace, #storyboardMain { min-width: 0; }
    @media (max-width: 760px) {
      body.canvas-overview-mode { padding-inline: 0 !important; }
      body.canvas-overview-mode .topbar-master-deck { padding-inline: 4px !important; }
      body.canvas-overview-mode .topbar-master-deck .recessed-deck-slot {
        justify-content: flex-start;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      body.canvas-overview-mode .topbar-master-deck .recessed-deck-slot::-webkit-scrollbar,
      body.canvas-overview-mode .canvas-rail-group::-webkit-scrollbar { display: none; }
      body.canvas-overview-mode #navPillsGroup { min-width: max-content; }
      body.canvas-overview-mode #storyboardWorkspace { flex-direction: column; }
      body.canvas-overview-mode #storyboardRail {
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #191c24;
      }
      body.canvas-overview-mode .canvas-rail-group {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 4px;
        padding: 4px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      body.canvas-overview-mode .canvas-rail-heading { flex: 0 0 auto; padding: 0 6px; }
      body.canvas-overview-mode .canvas-rail-heading.tools { margin: 0 0 0 4px; }
      body.canvas-overview-mode .canvas-rail-item {
        width: auto;
        min-width: 116px;
        min-height: 44px;
        margin: 0;
        flex: 0 0 auto;
      }
      body.canvas-overview-mode #storyboardMain { overflow: hidden; }
      body.canvas-overview-mode .canvas-overview-frame { min-width: 0; }
    }
  </style>

<body class="gw-shell bg-[#090a0d] text-slate-200 antialiased h-screen flex flex-col justify-between select-none overflow-hidden px-5 gw-type-body-md">

    <div class="flex items-center justify-between relative z-30 px-1 pt-0.5">

        <button class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 via-fuchsia-500 to-amber-300 p-0.5 shadow-[0_0_12px_rgba(236,72,153,0.7),0_0_6px_rgba(34,211,238,0.9)] hover:scale-110 active:scale-95 transition flex items-center justify-center cursor-pointer shrink-0 launch-orb-btn" title="智能体核心总线 (Agent Core)">

            <div class="w-3 h-3 rounded-full bg-gradient-to-r from-cyan-300 to-pink-400 animate-spin"></div>
          </div>
        </button>

          <span class="font-mono font-bold gw-type-body-md text-[#dfc384]">WORKBENCH</span>
          <span class="gw-type-body-sm font-mono px-2 py-0.5 rounded bg-black/60 border border-[#dfc384]/30 text-[#eddab3]">SYS.02 PRO</span>
        </div>
        <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-md bg-[#0a0c10] border border-white/10 shadow-inner">
          <span class="gw-type-body-sm font-mono text-amber-300 font-semibold" id="gwOnlineStatus" data-gw-degradation="not_integrated" title="读取真实探针 GET /api/observability/health">探测中…</span>
            <span class="relative flex h-2 w-2">

            <path d="M 2 8 A 6 6 0 0 1 8 2 L 134 2 A 4 4 0 0 1 138 5 L 146 43 A 4 4 0 0 1 142 47 L 8 47 A 6 6 0 0 1 2 41 Z"
                  fill="#0b0d13" stroke="#2e3547" stroke-width="1.5" stroke-linejoin="round" />
            <text x="10" y="13" style="font-family:var(--gw-font-mono);font-size:var(--gw-type-label-md);letter-spacing:normal" font-weight="700" fill="#dfc384">CPU</text>
            <path d="M 48.32 39.66 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />

      <div class="flex items-center space-x-2 shrink-0">

          <div class="flex items-center space-x-2 px-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#dfc384] shadow-[0_0_6px_#dfc384] animate-pulse"></span>

      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="trapezoid-uv-housing mr-1.5" title="RAM 内存监视表">
          <div class="uv-dial-backlight"></div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 148 48">
            <path d="M 146 8 A 6 6 0 0 0 140 2 L 14 2 A 4 4 0 0 0 10 5 L 2 43 A 4 4 0 0 0 6 47 L 140 47 A 6 6 0 0 0 146 41 Z"
                  fill="#0b0d13" stroke="#2e3547" stroke-width="1.5" stroke-linejoin="round" />
            <text x="138" y="13" text-anchor="end" style="font-family:var(--gw-font-mono);font-size:var(--gw-type-label-md);letter-spacing:normal" font-weight="700" fill="#dfc384">RAM</text>
            <path d="M 48.32 39.66 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />
            <path d="M 92.48 28.32 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
            <polygon id="svgNeedleRAM" points="73.3,48 74.7,48 74.3,19 73.7,19" fill="#ffffff" filter="drop-shadow(0 0 2.5px #38bdf8)" transform="rotate(25.9 74 48)" />
          </svg>
          <div class="uv-bottom-hub">
            <span class="uv-hub-percent text-cyan-300" id="ramValText">未接入</span>
          </div>
        </div>

        <div class="flex items-center space-x-1 bg-[#090b0e] p-1 rounded-lg border border-white/5">
          <button class="hw-round-btn w-7 h-7" title="停止"><div class="hw-round-inner w-4 h-4"><div class="w-1.5 h-1.5 bg-slate-400 rounded-sm"></div></div></button>
          <button class="hw-round-btn active w-7 h-7" title="运行"><div class="hw-round-inner w-4 h-4"><svg class="w-2.5 h-2.5 text-[#dfc384]" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div></button>
          <button class="hw-round-btn w-7 h-7" title="下一步"><div class="hw-round-inner w-4 h-4"><i data-lucide="skip-forward" class="w-2.5 h-2.5 text-slate-400"></i></div></button>
        </div>

        <div class="px-2.5 py-1.5 rounded bg-[#06070a] border border-[#dfc384]/30 font-mono gw-type-body-sm text-[#eddab3] font-bold shadow-inner flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#dfc384] shadow-[0_0_6px_#dfc384]"></span>
          <span id="masterDeckClock">00:00:00</span>
        </div>
        <button type="button" id="masterDeckDate" class="shrink-0 min-w-[76px] px-2.5 py-1.5 rounded bg-[#06070a] border border-[#dfc384]/45 font-mono gw-type-body-md text-[#eddab3] font-bold shadow-inner flex items-center justify-center space-x-1.5 hover:border-[#dfc384] transition" title="打开项目排期日历" aria-label="打开项目排期日历"><i data-lucide="calendar-days" class="w-3.5 h-3.5 text-[#dfc384]" aria-hidden="true"></i><span class="text-slate-500" id="masterDeckDateMonth">---</span><span id="masterDeckDateDay">--</span></button>
      </div>
    </div>

    <div class="recessed-deck-slot h-11 rounded-lg flex items-center justify-between px-2.5 relative z-30">
      <div class="flex items-center space-x-2 shrink-0" id="navPillsGroup">
                <a href="index.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="首页 · 控制台">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>首页 · 控制台</span>
        </a>
        <a href="projects.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="项目中心">
          <i data-lucide="folder-kanban" class="w-3.5 h-3.5"></i>
          <span>项目中心</span>
        </a>
        <a href="workshop.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="影视工坊">
          <i data-lucide="film" class="w-3.5 h-3.5"></i>
          <span>影视工坊</span>
        </a>
        <a href="production.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="剧集制片">
          <i data-lucide="clapperboard" class="w-3.5 h-3.5"></i>
          <span>剧集制片</span>
        </a>
        <a href="agents.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="智能体">
          <i data-lucide="bot" class="w-3.5 h-3.5"></i>
          <span>智能体</span>
        </a>
        <a id="storyboardNavCanvas" href="storyboard.html?view=canvas" class="pill-capsule-active px-3.5 py-1.5 gw-type-body-sm flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="画布">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>画布/工具</span>
        </a>
        <a href="assets.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="资产库">
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
          <span>资产库</span>
        </a>
        <a href="collab.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="协作">
          <i data-lucide="users" class="w-3.5 h-3.5"></i>
          <span>协作</span>
        </a>
        <a href="workflow.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="工作流">
          <i data-lucide="workflow" class="w-3.5 h-3.5"></i><span>工作流</span>
        </a>
        <a href="index.html?view=settings" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="系统设置">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          <span>设置</span>
        </a>

      <div class="flex items-center space-x-4 shrink-0">

            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>
          <span class="gw-type-body-sm font-mono text-amber-300 font-bold" id="flowPipelineReadout" data-gw-degradation="not_integrated" title="真实数据源：GET /api/observability/health">未接入</span>
        </div>
        <div class="flex items-center space-x-2">
          <span class="gw-type-body-sm font-mono text-slate-400 font-bold">VRAM</span>
          <div class="hw-fader-track-horizontal w-24">
            <div class="hw-fader-glow-bar" style="width: 0%; background: linear-gradient(90deg, #38bdf8 0%, #2dd4bf 100%);"></div>
            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>
          <span class="gw-type-body-sm font-mono text-amber-300 font-bold" id="gpuVramReadout" data-gw-degradation="not_integrated" title="真实数据源：GET /api/observability/health 的 gpu_telemetry 检查项">未接入</span>

      <div class="flex items-center space-x-3 shrink-0">

        <div class="hw-avatar-keycap ml-1 cursor-pointer hover:scale-105 active:scale-95 transition" title="认证状态未接入：点击打开认证中心查看真实登录状态" data-gw-identity="unverified">

  <div id="storyboardWorkspace" class="flex-1 flex overflow-hidden min-h-0">
    <!-- LEFT: 导航总线（全局画布与创作工具箱） -->
    <aside id="storyboardRail" class="w-64 bg-[#08090d] border-r border-[#191c24] flex flex-col shrink-0 z-30 h-full min-h-0">
      <div class="flex-1 overflow-y-auto min-h-0" id="railScrollArea">
        <!-- 分组一：全局画布 -->
        <section class="canvas-rail-group" aria-label="全局画布">
          <div class="canvas-rail-heading">全局画布</div>
          <button class="canvas-rail-item active" data-rail-type="canvas" data-canvas-rail="all" type="button" onclick="openCanvasOverview(this, 'all')"><i data-lucide="layout-grid" class="w-3.5 h-3.5"></i><span>画布首页</span></button>
          <button class="canvas-rail-item" data-rail-type="canvas" data-canvas-rail="classic" type="button" onclick="openCanvasOverview(this, 'classic')"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i><span>智能画布</span></button>
          <button class="canvas-rail-item" data-rail-type="canvas" data-canvas-rail="project" type="button" onclick="openCanvasOverview(this, 'project')"><i data-lucide="folder-kanban" class="w-3.5 h-3.5"></i><span>项目画布</span></button>
          <button class="canvas-rail-item" data-rail-type="canvas" data-canvas-rail="reference" type="button" onclick="openCanvasOverview(this, 'reference')"><i data-lucide="image" class="w-3.5 h-3.5"></i><span>参考画布</span></button>
        </section>

        <!-- 分组二：创作工具箱 -->
        <section class="canvas-rail-group" aria-label="创作工具箱">
          <div class="canvas-rail-heading tools">创作工具</div>
          <button class="canvas-rail-item" data-rail-type="tool" data-tool-id="storyboard" type="button" onclick="switchToolTab(this, 'storyboard')"><i data-lucide="film" class="w-3.5 h-3.5"></i><span>分镜矩阵 (4幕)</span></button>
          <button class="canvas-rail-item" data-rail-type="tool" data-tool-id="radar" type="button" onclick="switchToolTab(this, 'radar')"><i data-lucide="compass" class="w-3.5 h-3.5"></i><span>机位雷达 (Previs)</span></button>
          <button class="canvas-rail-item" data-rail-type="tool" data-tool-id="palette" type="button" onclick="switchToolTab(this, 'palette')"><i data-lucide="palette" class="w-3.5 h-3.5"></i><span>色彩管理</span></button>
          <button class="canvas-rail-item" data-rail-type="tool" data-tool-id="prompts" type="button" onclick="switchToolTab(this, 'prompts')"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i><span>提示词助手</span></button>
        </section>

        <!-- 分镜场次目录（仅在分镜矩阵工具激活时展示） -->
        <div id="storyboardSceneNavContainer" class="p-2 border-t border-white/5 space-y-1.5" style="display:none;">
          <div class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg bg-[#141720] border border-[#dfc384]/35 text-[#eddab3] gw-type-body-sm font-semibold shadow-md">
            <div class="flex items-center space-x-2">
              <i data-lucide="list-video" class="w-3.5 h-3.5 text-[#dfc384]"></i>
              <span>分镜场次</span>
            </div>
            <span class="gw-type-body-sm font-mono text-[#dfc384]">共 4 幕</span>
          </div>
          <div class="space-y-1 pt-1" id="storyboardSceneNav">
            <!-- 场次导航条目由 JS 动态渲染 -->
          </div>
        </div>
      </div>

      <!-- 底部操作栏（分镜矩阵模式下展示导出脚本） -->
      <div class="p-2.5 bg-[#050608] border-t border-white/5 shrink-0" id="storyboardExportFooter" style="display:none;">
        <button class="tactile-keycap w-full py-1.5 rounded-lg gw-type-body-md font-bold text-[#eddab3] flex items-center justify-center space-x-1" onclick="WorkbenchStoryboard.exportPdf()">
          <i data-lucide="file-down" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>导出导演分镜脚本</span>
        </button>
      </div>
    </aside>

    <!-- MAIN WORKSPACE: 多视图主工作区 -->
    <main id="storyboardMain" class="flex-1 p-2.5 min-h-0 flex flex-col space-y-2 overflow-hidden">
      <!-- 视图 1：画布总览 (嵌入 iframe) -->
      <iframe id="canvasOverviewFrame" class="canvas-overview-frame" title="画布总览" src="about:blank" scrolling="no" hidden></iframe>

      <!-- 视图 2：画布工作台承接面 (Canvas Workspace) -->
      <div id="canvasWorkspaceStage" class="canvas-workspace-stage flex flex-col flex-1 min-h-0 space-y-2" hidden>
        <!-- 顶部信息栏 & 面包屑 -->
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-3">
            <button class="tactile-keycap px-2.5 py-1 rounded text-slate-300 hover:text-white flex items-center space-x-1" onclick="exitCanvasWorkspace()" title="返回画布总览">
              <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-[#dfc384]"></i>
              <span>返回总览</span>
            </button>
            <div class="h-3.5 w-px bg-white/10"></div>
            <div class="flex items-center space-x-2">
              <i data-lucide="layout-template" class="w-4 h-4 text-[#dfc384]"></i>
              <h2 class="gw-type-headline-md font-bold text-slate-100" id="workspaceCanvasTitle">当前画布</h2>
              <span class="gw-type-body-sm font-mono px-2 py-0.5 rounded bg-black/60 border border-[#dfc384]/30 text-[#eddab3]" id="workspaceCanvasIdTag">cv-xxxx</span>
              <span class="gw-type-body-sm font-mono text-slate-400" id="workspaceCanvasVersion">v1</span>
            </div>
          </div>
          <div class="flex items-center space-x-2 gw-type-body-sm font-mono">
            <span class="text-slate-400" id="workspaceProjectBadge">项目: default</span>
            <div class="h-3.5 w-px bg-white/10"></div>
            <button class="tactile-keycap px-2.5 py-1 rounded text-slate-300 hover:text-white flex items-center space-x-1" id="btnExportCanvasGodmap" title="导出拓扑 JSON">
              <i data-lucide="download" class="w-3 h-3 text-[#dfc384]"></i>
              <span>导出 .godmap</span>
            </button>
          </div>
        </div>

        <!-- 工作台拓扑舞台（Task 3 将对其渲染工作流同源节点与连线动效） -->
        <div class="flex-1 min-h-0 relative overflow-hidden rounded-xl border border-white/10 bg-[#080a0e]" id="canvasTopologyContainer">
          <div class="absolute inset-0 infinite-grid-bg" id="canvasTopologyStage">
            <!-- 连线 SVG 层 -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="canvasTopologyWiresSvg" style="z-index: 10;"></svg>
            <!-- 节点容器层 -->
            <div class="absolute inset-0" id="canvasTopologyNodesLayer" style="z-index: 20;"></div>
          </div>
        </div>
      </div>

      <!-- 视图 3：分镜卡片网格矩阵 -->
      <div id="storyboardMatrixContent" class="storyboard-matrix-content flex flex-col flex-1 min-h-0 space-y-2">
        <!-- 顶栏批量控制与网格切换 -->
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
              <i data-lucide="film" class="w-4 h-4 text-[#dfc384]"></i>
              <h2 class="gw-type-headline-md font-bold text-slate-100" id="storyboardTitle">第 03 幕 · 钛金圣殿对峙 (共 6 个分镜)</h2>
            </div>
            <div class="h-3.5 w-px bg-white/10"></div>
            <span class="gw-type-body-sm font-mono text-amber-300" data-gw-degradation="not_integrated">渲染端点未接入（未纳入当前切片）</span>
          </div>

          <div class="flex items-center space-x-2 gw-type-body-sm font-mono">
            <button class="tactile-keycap px-2.5 py-1 rounded text-slate-300 hover:text-white flex items-center space-x-1" onclick="WorkbenchStoryboard.batchGenerate()">
              <i data-lucide="play" class="w-3 h-3 text-[#dfc384]"></i>
              <span>批量渲染所有分镜</span>
            </button>
            <button class="tactile-keycap px-2.5 py-1 rounded text-[#eddab3] font-bold flex items-center space-x-1" onclick="WorkbenchStoryboard.addNewShot()">
              <i data-lucide="plus" class="w-3 h-3 text-[#dfc384]"></i>
              <span>追加镜头</span>
            </button>
          </div>
        </div>

        <!-- 分镜网格容器 -->
        <div class="flex-1 min-h-0 overflow-y-auto pr-1">
          <div class="grid grid-cols-3 gap-2.5" id="storyboardGrid">
            <!-- 动态渲染 6 个分镜卡片 -->
          </div>
        </div>
      </div>

      <!-- 视图 4：独立创作工具面板 -->
      <div id="toolPanelContainer" class="tool-panel-container flex flex-col flex-1 min-h-0 space-y-2" hidden>
        <div class="champagne-card p-2 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-2">
            <i data-lucide="wrench" class="w-4 h-4 text-[#dfc384]" id="toolPanelIcon"></i>
            <h2 class="gw-type-headline-md font-bold text-slate-100" id="toolPanelTitle">创作工具</h2>
          </div>
          <span class="gw-type-body-sm font-mono text-[#dfc384]">GODS' TOOLKIT</span>
        </div>
        <div class="flex-1 min-h-0 rounded-xl border border-white/10 bg-[#0b0d13] p-6 flex flex-col items-center justify-center text-center space-y-4" id="toolPanelBody">
          <!-- 动态工具内容 -->
        </div>
      </div>
    </main>
  </div>

  <script>
    (function initStoryboardRoute() {
    const storyboardParams = new URLSearchParams(window.location.search);
    const matrix = document.getElementById('storyboardMatrixContent');
    const frame = document.getElementById('canvasOverviewFrame');
    const workspaceStage = document.getElementById('canvasWorkspaceStage');
    const toolContainer = document.getElementById('toolPanelContainer');
    const sceneNavContainer = document.getElementById('storyboardSceneNavContainer');
    const exportFooter = document.getElementById('storyboardExportFooter');
    const canvasContextKeys = ['project_id', 'project', 'entity_id', 'canvas_id'];

    function embeddedCanvasRoute(path, extraParams = {}, includeHash = false) {
      const url = new URL(path, location.origin);
      url.searchParams.set('embedded', '1');
      url.searchParams.set('v', '20261010-v2');
      canvasContextKeys.forEach(key => {
        const value = storyboardParams.get(key);
        if (value) url.searchParams.set(key, value);
      });
      Object.entries(extraParams).forEach(([key, value]) => url.searchParams.set(key, String(value)));
      if (includeHash) url.hash = 'embedded=1';
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function hideAllMainViews() {
      if (matrix) matrix.hidden = true;
      if (frame) frame.hidden = true;
      if (workspaceStage) workspaceStage.hidden = true;
      if (toolContainer) toolContainer.hidden = true;
    }

    window.openCanvasOverview = function openCanvasOverview(button, filter) {
      hideAllMainViews();
      document.body.classList.add('canvas-overview-mode');
      if (sceneNavContainer) sceneNavContainer.style.display = 'none';
      if (exportFooter) exportFooter.style.display = 'none';

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => {
        item.classList.toggle('active', item === button);
      });

      if (frame) {
        frame.hidden = false;
        frame.title = '画布总览';
        const currentSrc = frame.getAttribute('src');
        const targetUrl = embeddedCanvasRoute('/static/canvas-list.html', { layout: 'overview', filter }, true);
        if (!currentSrc || currentSrc === 'about:blank') {
          frame.src = targetUrl;
        } else {
          frame.contentWindow?.postMessage({ type: 'canvas-filter', filter }, location.origin);
        }
      }
      document.title = '画布 · Gods\' Workbench';
    };

    window.switchToolTab = function switchToolTab(button, toolId) {
      hideAllMainViews();
      document.body.classList.remove('canvas-overview-mode');

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => {
        item.classList.toggle('active', item === button);
      });

      if (toolId === 'storyboard') {
        if (matrix) matrix.hidden = false;
        if (sceneNavContainer) sceneNavContainer.style.display = 'block';
        if (exportFooter) exportFooter.style.display = 'block';
        document.title = '分镜画布矩阵 · Gods\' Workbench';
      } else {
        if (sceneNavContainer) sceneNavContainer.style.display = 'none';
        if (exportFooter) exportFooter.style.display = 'none';
        if (toolContainer) {
          toolContainer.hidden = false;
          renderToolPanelContent(toolId);
        }
      }
    };

    function renderToolPanelContent(toolId) {
      const titleEl = document.getElementById('toolPanelTitle');
      const bodyEl = document.getElementById('toolPanelBody');
      if (!titleEl || !bodyEl) return;

      if (toolId === 'radar') {
        titleEl.textContent = '2D 顶视机位雷达 (Previs 预演)';
        bodyEl.innerHTML = `
          <div class="max-w-md space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-[#dfc384]/10 border border-[#dfc384]/30 flex items-center justify-center mx-auto text-[#dfc384]">
              <i data-lucide="compass" class="w-8 h-8"></i>
            </div>
            <h3 class="gw-type-headline-md font-bold text-slate-100">原生 2D HTML5 Canvas 机位雷达</h3>
            <p class="text-slate-400 gw-type-body-sm leading-relaxed">
              支持在网格标尺舞台上拖拽摄像机视锥箭头与演员目标点，实时解算视角 FOV 与俯仰角，导出标准 CameraCtrl / Wan2.1 轨迹 JSON。
            </p>
            <div class="p-3 bg-[#07080b] rounded-lg border border-white/10 text-left font-mono gw-type-body-sm text-amber-300">
              [P2 分镜增强] 遵循 3D-ASSET-PREVIS-AND-STORYBOARD-SPEC 规范构建中
            </div>
          </div>
        `;
      } else if (toolId === 'palette') {
        titleEl.textContent = '色彩管理与调色板';
        bodyEl.innerHTML = `
          <div class="max-w-md space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-[#38bdf8]/10 border border-[#38bdf8]/30 flex items-center justify-center mx-auto text-[#38bdf8]">
              <i data-lucide="palette" class="w-8 h-8"></i>
            </div>
            <h3 class="gw-type-headline-md font-bold text-slate-100">黑金影视色彩调色系统</h3>
            <p class="text-slate-400 gw-type-body-sm leading-relaxed">
              统一管理影视镜头色调预设、LUT 配置文件与调色板，确保项目全链路视觉一致性。
            </p>
          </div>
        `;
      } else if (toolId === 'prompts') {
        titleEl.textContent = '提示词助手';
        bodyEl.innerHTML = `
          <div class="max-w-md space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-[#c084fc]/10 border border-[#c084fc]/30 flex items-center justify-center mx-auto text-[#c084fc]">
              <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <h3 class="gw-type-headline-md font-bold text-slate-100">影视镜头提示词结构化生成器</h3>
            <p class="text-slate-400 gw-type-body-sm leading-relaxed">
              集成景别、机位角度、灯光氛围、画风品质等影视术语标准化模板，一键赋能工作流。
            </p>
          </div>
        `;
      }
      if (window.lucide) lucide.createIcons();
    }

    window.exitCanvasWorkspace = function exitCanvasWorkspace() {
      const allBtn = document.querySelector('[data-canvas-rail="all"]');
      if (allBtn) openCanvasOverview(allBtn, 'all');
    };

    // 默认路由判断
    if (storyboardParams.get('embedded') === '1') {
      document.body.classList.add('embedded');
    }
    const reqView = storyboardParams.get('view');
    if (reqView === 'canvas' || !reqView) {
      // 默认或明确为 canvas 时进入画布总览
      const allBtn = document.querySelector('[data-canvas-rail="all"]');
      openCanvasOverview(allBtn, 'all');
    } else if (reqView === 'storyboard') {
      const sbBtn = document.querySelector('[data-tool-id="storyboard"]');
      switchToolTab(sbBtn, 'storyboard');
    } else if (reqView === 'radar') {
      const radarBtn = document.querySelector('[data-tool-id="radar"]');
      switchToolTab(radarBtn, 'radar');
    }

    // 监听子 iframe 发来的消息 (如 canvas-filter、canvas-open)
    if (window.__gwCanvasMsgHandler) window.removeEventListener('message', window.__gwCanvasMsgHandler);
    window.__gwCanvasMsgHandler = event => {
      if (event.origin && event.origin !== location.origin) return;
      if (event.data?.type === 'canvas-filter') {
        frame?.contentWindow?.postMessage(event.data, location.origin);
        document.querySelectorAll('[data-canvas-rail]').forEach(item => {
          item.classList.toggle('active', item.dataset.canvasRail === event.data.filter);
        });
      } else if (event.data?.type === 'canvas-open') {
        // Task 3: 捕获打开画布事件并进入画布工作台
        handleCanvasOpen(event.data.canvas);
      }
    };
    window.addEventListener('message', window.__gwCanvasMsgHandler);

    function handleCanvasOpen(canvas) {
      if (!canvas) return;
      hideAllMainViews();
      document.body.classList.add('canvas-overview-mode');
      if (sceneNavContainer) sceneNavContainer.style.display = 'none';
      if (exportFooter) exportFooter.style.display = 'none';

      document.querySelectorAll('#storyboardRail .canvas-rail-item').forEach(item => item.classList.remove('active'));

      if (workspaceStage) {
        workspaceStage.hidden = false;
        const titleEl = document.getElementById('workspaceCanvasTitle');
        const idTagEl = document.getElementById('workspaceCanvasIdTag');
        const verEl = document.getElementById('workspaceCanvasVersion');
        const projBadge = document.getElementById('workspaceProjectBadge');
        if (titleEl) titleEl.textContent = canvas.title || '未命名画布';
        if (idTagEl) idTagEl.textContent = canvas.id || 'cv-xxxx';
        if (verEl) verEl.textContent = canvas.version ? `v${canvas.version}` : 'v1';
        if (projBadge) projBadge.textContent = `项目: ${canvas.project || 'default'}`;

        document.title = `${canvas.title || '画布'} · 工作台`;

        // 触发工作台拓扑渲染（Task 3 将接入）
        window.dispatchEvent(new CustomEvent('gw:render-canvas-workspace', { detail: canvas }));
      }
    }
    if (window.lucide) lucide.createIcons();
    })();
  </script>
  <script src="/static/js/core/degradation.js?v=v0.0.1-alpha-2026"></script>
  <script src="/static/js/core/hardware-telemetry.js?v=20261008-auth6"></script>
  <script src="/static/js/controllers/storyboard-controller.js"></script>
  <script src="/static/js/modules/canvas-workspace.js?v=20261010-v1"></script>
<script src="/static/js/core/workbench-shell.js?v=20261009-parse-cf7"></script>
</body>
</html>
