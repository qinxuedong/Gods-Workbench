<body class="gw-signal gw-page--episode-pipeline">
  <a class="skip-link" href="#episodePipeline">跳至剧集制片内容</a>
  <main class="workspace-page episode-page">
    <header class="episode-header">
      <nav id="episodeStepNav" class="episode-stepbar workflow-steps" role="tablist" aria-label="剧集四步工作流" hidden aria-hidden="true"></nav>
    </header>

    <section class="episode-create panel" id="createPanel" hidden aria-labelledby="createTitle">
      <div class="panel-heading">
        <div><h2 id="createTitle">新建剧集流水线</h2><p>剧集会绑定当前项目，四个阶段共享同一组持久任务。</p></div>
        <button class="icon-button" type="button" id="closeCreate" aria-label="关闭新建表单" title="关闭">×</button>
      </div>
      <form id="createForm" class="episode-form">
        <div class="form-grid">
          <label>剧集名称<input name="title" required maxlength="200" value="第一集"></label>
          <label>剧集提示词库<select name="prompt_library_id" id="promptLibrary" required></select></label>
          <label class="wide">创作种子<textarea name="seed" maxlength="20000" rows="4" placeholder="人物、冲突、场景和情绪线索"></textarea></label>
        </div>
        <div class="form-actions"><span class="form-error" id="createError" role="alert"></span><button class="btn" type="button" id="cancelCreate">取消</button><button class="btn primary" type="submit">创建流水线</button></div>
      </form>
    </section>

    <section id="episodePipeline" tabindex="-1" aria-live="polite">
      <div class="episode-loading panel">正在读取项目和流水线…</div>
    </section>
    <dialog id="assetDetailDialog" class="asset-detail-dialog" data-floating-surface="episode-asset-detail" data-floating-kind="native-dialog" data-floating-content=".asset-detail-shell" data-floating-dismiss="outside" data-floating-escape="close-only" aria-label="资产详情"></dialog>
    <dialog id="assetImageDialog" class="asset-image-dialog" data-floating-surface="episode-asset-image" data-floating-kind="native-dialog" data-floating-content=".asset-image-shell" data-floating-dismiss="outside" data-floating-escape="close-only" aria-label="资产图片预览"></dialog>
    <div class="episode-degradation" id="episodeDegradation" role="status" aria-live="polite" hidden></div>
    <div class="episode-toast" id="episodeToast" role="status" aria-live="polite"></div>
  </main>
