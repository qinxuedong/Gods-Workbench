# System1 通用 CPU HTTP 适配器；Kev 模型由 KEV_ENDPOINT 指向的独立服务加载。
# 本文件不下载模型、不接收上游 Kev 凭据，也不代表真实 NAS 已验收。

services:
  system1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.system1
    image: gods-workbench-system1:local
    user: "10001:10001"
    environment:
      GW_RUNTIME_MODE: prod
      LOCALAPPDATA: /var/lib
      GW_DISABLE_AGENT_INTEGRATION: "1"
      GW_CPU_ONLY: "1"
      GW_ALLOWED_HOSTS: "${GW_ALLOWED_HOSTS:-}"
      KEV_ENDPOINT: ${KEV_ENDPOINT:?set the Kev inference endpoint}
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: "void"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    ports:
      - "${SYSTEM1_PORT:-2078}:2077"
    volumes:
      - system1-data:/var/lib/GodsWorkbench
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 500M
    mem_limit: 500m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2077/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  system1-data:
    name: gods-workbench-system1-data
